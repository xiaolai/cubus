<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cubus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts degrade to the system-ui / serif fallbacks in tokens.css when offline (Tauri). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Zilla+Slab:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      /* App shell + screens. Colours/space/type all come from tokens.css (the approved design
         system); this file only arranges them. Cube sticker colours live in cubus-cube.js. */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--font-ui); font-size: var(--fs-body); line-height: var(--lh-body);
        -webkit-font-smoothing: antialiased;
      }
      /* The window IS the OS window — no fake desk/frame (paper-one WindowShell). macOS gets a
         custom overlay titlebar; the OS paints the real traffic lights over it in Tauri. Windows
         and Linux use the native title bar, so we draw none. --titlebar-h is the strip the macOS
         overlay reserves; 0 elsewhere. */
      :root { --titlebar-h: 0px; }
      html[data-platform="macos"] { --titlebar-h: var(--titlebar-macos); }
      .num { font-family: var(--font-num); } /* Zilla Slab — every numeral, time, alg */
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      button:disabled { opacity: .5; cursor: default; }
      .eyebrow { font-size: var(--fs-meta); font-weight: 700; letter-spacing: .13em; color: var(--ink-5); text-transform: uppercase; }

      /* ---- window + panes ------------------------------------------------- */
      .app { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
      .win { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
      /* Window chrome per platform (paper-one TitleBar). macOS: an absolute overlay strip the OS
         paints the traffic lights over. Windows/Linux: a real 44px row, shown in a browser preview
         (?platform=windows|linux); the Tauri build uses the native title bar there, so the custom
         row is hidden in-app to avoid a double bar. --titlebar-h is the OVERLAY clearance (macOS 52;
         0 elsewhere — the real row occupies its own space). */
      .titlebar { display: none; align-items: center; gap: 10px; padding: 0 12px; }
      html[data-platform="macos"] .titlebar {
        display: flex; position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: var(--titlebar-macos);
      }
      html[data-platform="windows"][data-host="web"] .titlebar,
      html[data-platform="linux"][data-host="web"] .titlebar {
        display: flex; position: relative; flex: 0 0 auto; height: var(--titlebar-other);
        background: var(--panel-sunk); border-bottom: 1px solid var(--line); z-index: 2;
      }
      .titlebar .chip { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: var(--fs-body-s); }
      .tb-zone { display: flex; align-items: center; }
      .tb-lights { flex: 0 0 var(--sys-zone-macos); gap: var(--light-gap); padding-left: 6px; }
      html[data-platform="macos"] .tb-macos-trail { flex: 0 0 var(--sys-zone-macos); }
      .tl { width: var(--light-size); height: var(--light-size); border-radius: var(--r-pill); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
      /* Windows/Linux: app controls lead, caption buttons trail. */
      .tb-apps { gap: 8px; }
      .tb-ctl { width: 30px; height: 30px; border-radius: var(--r-3); display: grid; place-items: center; color: var(--ink-4); background: none; }
      .tb-ctl:hover { background: var(--bg); color: var(--ink); }
      .tb-ctl.on { background: var(--bg); color: var(--accent); }
      .tb-caption.windows { gap: 0; }
      .tb-caption.linux { gap: 8px; padding-right: 8px; }
      .tb-cap { width: var(--caption-w); height: var(--caption-h); display: grid; place-items: center; color: var(--ink-3); background: none; }
      .tb-cap:hover { background: var(--line); }
      .tb-cap.close:hover { background: #C42B1C; color: #fff; }
      .tb-cap.round { width: 24px; height: 24px; border-radius: var(--r-pill); background: var(--line); color: var(--ink-2); }
      .tb-cap.round:hover { background: var(--line-strong); }
      .tb-cap.round.close:hover { background: #C42B1C; color: #fff; }
      .titlebar .chip b { font-weight: 600; } .titlebar .chip span { color: var(--ink-4); }

      .body { flex: 1; display: flex; min-height: 0; }

      /* leading nav pane */
      .pane {
        flex: 0 1 var(--pane-w); min-width: var(--pane-min); background: var(--panel);
        border-radius: var(--r-card); box-shadow: var(--shadow-card);
        margin: var(--inset); padding: 16px 0 12px;
        display: flex; flex-direction: column; overflow: hidden;
      }
      /* macOS: the leading card slides UNDER the overlay titlebar. margin clears the window edge
         (8px); padding-top clears the 52px titlebar measured from the card's own top — already 8px
         down — so it subtracts the inset (= 44px). Straight from paper-one's LeadingCard. */
      html[data-platform="macos"] .pane { padding-top: calc(var(--titlebar-h) - var(--inset)); }
      .brand { padding: 0 16px 22px; display: flex; align-items: baseline; gap: 8px; }
      .brand b { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-wordmark); letter-spacing: -.01em; }
      .brand span { font-size: var(--fs-meta); color: var(--ink-5); letter-spacing: .08em; }
      .nav { flex: 1; min-height: 0; overflow-y: auto; }
      .nav-group { margin-bottom: 16px; }
      .nav-group > .eyebrow { padding: 0 16px 6px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px; padding: 7px 16px; width: 100%;
        border-left: 3px solid transparent; color: var(--ink-3); font-size: var(--fs-body-l); text-align: left;
      }
      .nav-item:hover { color: var(--ink); }
      .nav-item.active { border-left-color: var(--accent); color: var(--accent); font-weight: 700; }
      .nav-item .ico { display: grid; place-items: center; width: 16px; }
      .nav-item .lbl { flex: 1; }
      .nav-item .meta { font-family: var(--font-num); font-size: var(--fs-meta); color: var(--ink-5); }
      .cube-status { margin: 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-4); background: var(--bg); }
      .cube-status .row { display: flex; align-items: center; gap: 8px; }
      .cube-status .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: cubusPulse var(--pulse) infinite; }
      .cube-status.on .pulse { background: var(--ok); }
      .cube-status b { font-size: var(--fs-body-s); font-weight: 600; }
      .cube-status .sub { font-size: var(--fs-caption); color: var(--ink-4); margin-top: 3px; }
      @keyframes cubusPulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes cubusScan { from { transform: translateY(0) } to { transform: translateY(230px) } }

      /* main column */
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: var(--titlebar-h); }
      .topbar {
        flex: none; padding: 20px 30px 14px; border-bottom: 1px solid var(--line);
        display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      }
      .topbar h1 { font-family: var(--font-num); font-size: var(--fs-title-l); font-weight: 600; line-height: 1.1; margin: 0; }
      .topbar .sub { font-size: var(--fs-body); color: var(--ink-4); margin-top: 3px; }
      .topbar .right { display: flex; align-items: center; gap: 10px; }
      .badge { font-family: var(--font-num); font-size: var(--fs-caption); color: var(--ink-4); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px 11px; }
      .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--invert-bg); color: var(--invert-fg); display: grid; place-items: center; font-size: var(--fs-body-s); font-weight: 700; }

      .stage { flex: 1; min-height: 0; overflow: hidden; padding: 24px 30px; }
      .screen { display: none; height: 100%; }
      .screen.active { display: block; }
      .cols { display: flex; gap: 22px; height: 100%; }
      .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
      .aside { flex: 0 1 var(--aside-w); min-width: var(--aside-min); display: flex; flex-direction: column; gap: 16px; }

      /* ---- primitives ----------------------------------------------------- */
      .card { border: 1px solid var(--line); border-radius: var(--r-5); background: var(--panel); padding: 16px 18px; }
      .card.tight { padding: 0; overflow: hidden; }
      .card.dark { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
      .stat { }
      .stat .v { font-family: var(--font-num); font-size: var(--fs-display); font-weight: 600; letter-spacing: -.02em; }
      .stat .d { font-size: var(--fs-body-s); color: var(--ink-4); }
      .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
      .btn { height: 40px; padding: 0 18px; border-radius: var(--r-4); display: inline-flex; align-items: center; gap: 8px; justify-content: center; font-size: var(--fs-body-l); font-weight: 600; }
      .btn.primary { background: var(--invert-bg); color: var(--invert-fg); }
      .btn.accent { background: var(--accent); color: #fff; }
      .btn.outline { border: 1px solid var(--line-strong); color: var(--ink-2); }
      .btn.accent-outline { border: 1px solid var(--accent); color: var(--accent); }
      .btn.sm { height: 32px; padding: 0 12px; font-size: var(--fs-body-s); }
      .btn.block { width: 100%; }
      .pill { border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 15px; font-size: var(--fs-body); font-weight: 600; color: var(--ink-3); }
      .pill.on { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
      .bar { height: 6px; background: var(--panel-sunk); border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .field { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-3); padding: 7px 10px; font-family: var(--font-num); font-size: var(--fs-body-s); }
      .toggle { width: 40px; height: 22px; border-radius: 12px; background: var(--track); position: relative; flex: none; }
      .toggle.on { background: var(--accent); }
      .toggle > i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left var(--fade); }
      .toggle.on > i { left: 20px; }
      svg.ic { width: 1em; height: 1em; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* cube slot */
      .cube-slot { width: 100%; height: 100%; min-height: 220px; display: block; }
      cubus-cube { display: block; width: 100%; height: 100%; }

      /* card header/list */
      .card-h { padding: 14px 18px 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--panel-sunk); }
      .card-h b { font-size: var(--fs-body-l); font-weight: 700; }
      .list { flex: 1; min-height: 0; overflow-y: auto; }
      .row { display: grid; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--line-faint); font-size: var(--fs-body); }
      .link { color: var(--accent); font-size: var(--fs-body-s); }

      /* lens / camera */
      .lens { position: relative; flex: 1; min-height: 220px; border-radius: var(--r-6); background: var(--lens); overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .lens .veil { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, rgba(90,82,68,.55), rgba(20,18,14,.95)); }
      .lens .scanline { position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: rgba(46,107,255,.7); animation: cubusScan 2.6s ease-in-out infinite alternate; }
      .lens .grid { position: relative; width: 250px; height: 250px; }
      .lens .grid .cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 6px; }
      .lens .grid .cells > div { border-radius: 4px; border: 1.5px solid rgba(246,242,233,.5); }
      .bracket { position: absolute; width: 26px; height: 26px; }
      .bracket.tl { left: -14px; top: -14px; border-left: 3px solid var(--accent); border-top: 3px solid var(--accent); }
      .bracket.tr { right: -14px; top: -14px; border-right: 3px solid var(--accent); border-top: 3px solid var(--accent); }
      .bracket.bl { left: -14px; bottom: -14px; border-left: 3px solid var(--accent); border-bottom: 3px solid var(--accent); }
      .bracket.br { right: -14px; bottom: -14px; border-right: 3px solid var(--accent); border-bottom: 3px solid var(--accent); }
      .lens .tag { position: absolute; left: 18px; top: 16px; display: flex; gap: 8px; align-items: center; }
      .lens .tag b { background: rgba(46,107,255,.92); color: #fff; font-size: var(--fs-caption); font-weight: 700; letter-spacing: .08em; border-radius: 4px; padding: 4px 9px; }
      .lens .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 18px; background: linear-gradient(transparent, rgba(16,14,11,.9)); color: var(--on-lens); }
      .lens .cap .p { font-size: var(--fs-body-l); font-weight: 600; }
      .lens .cap .h { font-size: var(--fs-body-s); color: var(--on-lens-dim); margin-top: 2px; }

      /* 2D net */
      .net { display: grid; grid-template-columns: repeat(12,1fr); grid-template-rows: repeat(9,1fr); gap: 3px; aspect-ratio: 12/9; max-width: 320px; margin: 0 auto; }
      .net .face { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 2px; }
      .net .sticker { border-radius: 3px; border: 1px solid rgba(0,0,0,.28); transition: background var(--fade); }
      .mono { font-family: var(--font-num); font-size: var(--fs-caption); color: var(--ink-4); line-height: 1.6; word-break: break-all; }
      .move-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip-m { font-family: var(--font-num); font-size: var(--fs-body-l); font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink-5); border-radius: 4px; padding: 4px 9px; }
      .chip-m.played { background: var(--panel-sunk); color: var(--ink); }
      .chip-m.cur { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }

      /* modal (AI scan owns its own camera) */
      .modal { position: fixed; inset: 0; background: rgba(1,4,9,.72); display: grid; place-items: center; z-index: 50; }
      .modal[hidden] { display: none; }
      .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-6); padding: 20px; width: min(560px, 94vw); }
      .modal h3 { margin: 0 0 12px; font-size: var(--fs-title-s); }

      @media (max-width: 1120px) { .app { padding: 0; } .win { border-radius: 0; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="win">
        <div class="titlebar" id="titlebar" data-tauri-drag-region>
          <div class="tb-zone" id="tbLead"></div>
          <div class="chip"><b>cubus</b><span>3×3 · CFOP · session 14</span></div>
          <div class="tb-zone" id="tbTrail"></div>
        </div>

        <div class="body">
          <!-- leading nav pane -->
          <nav class="pane">
            <div class="brand"><b>cubus</b><span>0.4.2</span></div>
            <div class="nav" id="nav"></div>
            <div class="cube-status" id="cubeStatus">
              <div class="row"><span class="pulse"></span><b id="cubeStatusLabel">No smart cube</b></div>
              <div class="sub" id="cubeStatusSub">Camera works on its own</div>
            </div>
          </nav>

          <!-- main -->
          <div class="main">
            <div class="topbar">
              <div><h1 id="title">Cubus</h1><div class="sub" id="subtitle"></div></div>
              <div class="right"><span class="badge">3×3 · CFOP</span><span class="avatar">M</span></div>
            </div>
            <div class="stage" id="stage"><!-- screens injected here --></div>
          </div>
        </div>
      </div>
    </div>

    <!-- AI camera scanner (YOLOv11): show the six sides in any order, each captured automatically.
         Registered by ./vendor/ai-scan-panel.js; owns onnxruntime-web (model + wasm from ./vendor/). -->
    <div class="modal" id="scanModal" hidden>
      <div class="box">
        <h3>Camera scan <span class="eyebrow" style="color:var(--warn)">YOLO</span></h3>
        <ai-scan-panel id="aiPanel"></ai-scan-panel>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px">
          <span class="sub" style="color:var(--ink-4)">Show each side flat and centred — each is captured automatically.</span>
          <button class="btn outline sm" id="scanClose">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="./vendor/cubus-cube.js"></script>
    <script type="module" src="./vendor/ai-scan-panel.js"></script>
    <script type="module" src="./lib/app.js"></script>
  </body>
</html>
