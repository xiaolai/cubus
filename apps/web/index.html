<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the page runs under the Dynamic Island and behind the home indicator,
         and .app pads itself by env(safe-area-inset-*) — the insets are the app's to place, not
         the browser's to letterbox. Inert on desktop, where the insets are 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cubus</title>
    <!-- Icons. All generated from dev-docs/design/icons/cubus-icon-flat.svg by
         scripts/build-icons.sh — see dev-docs/icons.md. icon.svg is listed first so
         browsers that support it skip the rasters entirely; favicon.ico stays for the
         address bar and for anything that still asks for /favicon.ico by convention.
         apple-touch-icon is deliberately opaque: iOS composites a transparent one
         against black, which rings the tile. -->
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241F18" media="(prefers-color-scheme: dark)" />
    <!-- No web fonts, by decision (2026-08-27): tokens.css names system stacks only, so the page
         loads NOTHING remote — the offline test enforces zero exceptions now that the Google
         Fonts stylesheet, the one accepted gap, is gone. -->
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      /* App shell + screens. Colours/space/type all come from tokens.css (the approved design
         system); this file only arranges them. Cube sticker colours live in cubus-cube.js. */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      /* Chrome is not a document. Clicking a sticker, a nav item or a button placed a real text
         caret (getSelection().type === 'Caret') inside it; Chrome does not paint one, but the
         WKWebView the desktop app runs in does, so clicking a cube face blinked an insertion point
         in it. Selection is restored below for real form controls: a text input you cannot put a
         cursor in is broken. It used to be restored for .mono, the raw facelet string, but both
         screens that printed one dropped it, so that exception guarded nothing and is gone. */
      body { user-select: none; -webkit-user-select: none; }
      input, select, textarea { user-select: text; -webkit-user-select: text; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--font-ui); font-size: var(--fs-body); line-height: var(--lh-body);
        -webkit-font-smoothing: antialiased;
      }
      /* The window IS the OS window — no fake desk/frame (paper-one WindowShell). The app draws its
         own title bar on every platform, and the bar is the navigation: the tabs sit in it, so
         there is no leading pane. macOS overlays it on the OS bar (the real traffic lights are
         painted over it); Windows and Linux windows are created without decorations
         (tauri.windows.conf.json / tauri.linux.conf.json), so the caption buttons drawn here are
         the only ones there are. --titlebar-h is the clearance .main leaves for the bar. */
      :root { --titlebar-h: var(--titlebar-other); --tabbar-h: 49px; }
      html[data-platform="macos"] { --titlebar-h: var(--titlebar-macos); }
      /* A finger gets the 52px bar on every platform: the touch floors below make each control
         44px, and 44px controls do not fit a 44px bar. */
      @media (pointer: coarse) { :root, html[data-platform] { --titlebar-h: var(--titlebar-macos); } }
      .num { font-family: var(--font-num); } /* the system mono stack — every numeral, time, alg */
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      button:disabled { opacity: .5; cursor: default; }
      /* ONE motion rule for the controls. Hover, marking and disabled changes all ease by the
         same token — a control that snaps reads as a different product from the one beside it
         that fades, and this rule replaced five identical per-selector transitions plus ten
         controls that had none. Transform and box-shadow are in the list for the chip
         affordances (the colour swatches' lift, the scan grid's rings); property-specific
         transitions stay their own (.toggle > i's left, .net .sticker's background, the
         progress bar's width). design-discipline.test.mjs holds this list against the sheet's
         :hover selectors: a new hoverable control joins it or the test names it. */
      :is(.btn, .pill, .nav-item, .tb-ctl, .tbtn, .tb-cap, .menu > button, .card-tools > button,
          .eyebrow-row > button, .chip-m, .swatches > button, .field, .link, .toggle,
          .scan-face .tgrid > .cell) {
        transition: background var(--fade), color var(--fade), border-color var(--fade),
          box-shadow var(--fade), opacity var(--fade), transform var(--fade);
      }
      .eyebrow { font-size: var(--fs-meta); font-weight: 700; letter-spacing: .13em; color: var(--ink-5); text-transform: uppercase; }

      /* ---- window + title bar --------------------------------------------- */
      /* The app box is the OS-safe area: 100dvh less the safe-area insets (Dynamic Island, home
         indicator; 0 on desktop), and a size container named `app`, so chrome can ask ITS
         orientation. Nothing in this stylesheet asks the viewport's — under the layout contract
         (dev-docs/stage-contract.md) the viewport is not the stage, and a viewport query is the
         wrong signal; a test bans them. The insets are custom properties so the harness can stand
         in for a phone: app.js sets --inset-* from `?insets=t,r,b,l`. */
      .app {
        --inset-t: env(safe-area-inset-top, 0px); --inset-r: env(safe-area-inset-right, 0px);
        --inset-b: env(safe-area-inset-bottom, 0px); --inset-l: env(safe-area-inset-left, 0px);
        height: 100dvh; padding: var(--inset-t) var(--inset-r) var(--inset-b) var(--inset-l);
        container-type: size; container-name: app;
        display: flex; flex-direction: column; background: var(--bg);
      }
      .win { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
      /* The title bar is the app's toolbar (paper-one TitleBar). Two zones at its ends: macOS
         leads with the traffic-light gap and the wordmark and trails with Settings; Windows/Linux
         lead with the wordmark and trail with Settings and the caption buttons; iOS/Android lead
         with the wordmark and trail with Settings. The tabs are not its children any more (see
         .tabs below) — in landscape they float over its centre line. The bar is transparent — it
         sits on the paper like everything else. `data-tauri-drag-region="deep"` on the bar makes
         its whole subtree a drag handle; Tauri's drag script exempts buttons on its own. */
      .titlebar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 5;
        height: var(--titlebar-h); display: flex; justify-content: space-between; align-items: center;
        padding: 0 12px;
      }
      /* flex: none — the zones never shrink; the tab row is what adapts (compact). With
         `0 1 auto` WebKit sized the lead zone under its content while the bar had 600px free,
         and the wordmark ran out of its box under the tabs. */
      .tb-zone { display: flex; align-items: center; gap: 4px; flex: none; }
      .tb-trail { justify-content: flex-end; }
      /* The traffic-light gap. The OS paints the real lights at trafficLightPosition; in a browser
         preview (?chrome=preview) three dots stand in. */
      /* padding-left + the titlebar's 12px padding + half a dot = the real close button's CENTRE.
         The truth is measured, not designed: Finder's tall-toolbar lights centre at 25.75pt on
         this macOS, so tauri.conf.json says x:19 (centre = x + 6.75) and the preview dots match:
         12 + 7.75 + 6 = 25.75. */
      /* width AND flex: none, not a flex-basis alone. WebKit sizes the zone's intrinsic width
         from this span's content (its padding, 7.75px) rather than its 82px basis, then lays it
         out at 82 — which pushed the wordmark out of the zone and under the tabs. An explicit
         width is counted. */
      .tb-lights { display: flex; align-items: center; flex: none; width: var(--sys-zone-macos); gap: var(--light-gap); padding-left: 7.75px; }
      /* A preview portrait of macOS's own lights (their fills are set inline by buildChrome);
         the hairline is the OS's, not the theme's — see tokens.css, "OS-owned colors". */
      .tl { width: var(--light-size); height: var(--light-size); border-radius: var(--r-pill); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
      /* The mark is icons/icon.svg — the transparent variant, so it reads on the paper in both
         themes without a tile behind it. */
      .brand { display: flex; align-items: center; gap: 7px; padding: 0 6px; }
      .brand .mark { flex: none; width: 20px; height: 20px; display: block; }
      .brand b { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-title-s); letter-spacing: -.01em; }

      /* The tabs: a segmented control in the macOS/iOS manner — one capsule, the current screen
         filled in ink. Four screens by default and never more than eight. The capsule's ground is
         mixed from --ink so it reads as a slight well in both themes without a token of its own.

         The row is .win's own child, not the bar's, so it can be two things by orientation with
         one DOM. Landscape: floated over the bar's centre line, so the tabs sit on the window's
         centre whatever the lead and trail zones weigh. Portrait: a real row at the foot of the
         window, in flow, so the stage above shrinks by exactly the bar — the "bottom bar" the
         contract's fixtures subtract. Asked of the app container, never the window. */
      .tabs { position: absolute; top: 0; left: 50%; translate: -50% 0; z-index: 6; height: var(--titlebar-h); display: flex; align-items: center; }
      .tabs .capsule { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--ink) 7%, transparent); }
      /* Icons only when the labelled row would not fit between the bar's outer zones — measured
         by app.js (fitTabs), because whether six labelled tabs fit depends on the tabs, the
         language and the platform's lead zone, none of which a width can know. */
      .tabs.compact .nav-item { padding: 0 10px; }
      .tabs.compact .nav-item .lbl { display: none; }
      @container app (orientation: portrait) {
        .tabs { position: static; translate: none; height: var(--tabbar-h); width: 100%; flex: none; border-top: 1px solid var(--line); background: var(--panel); }
        .tabs .capsule { width: 100%; height: 100%; padding: 0; gap: 0; border-radius: 0; background: none; }
        /* Icon over a word, every tab the same width — the tab-bar idiom of both phone platforms.
           Under every icon there is room for the word, so compact never applies here. Selectors
           carry `.tabs` because the base .nav-item rules come later in this sheet at the same
           specificity, and the bottom bar must win. */
        .tabs .nav-item { flex: 1 1 0; min-width: 0; height: 100%; padding: 0; flex-direction: column; justify-content: center; gap: 3px; border-radius: 0; font-size: var(--fs-micro); font-weight: 600; color: var(--ink-4); }
        .tabs .nav-item .ico { width: auto; }
        .tabs .nav-item .ico svg { width: 22px; height: 22px; }
        .tabs .nav-item.active { background: none; color: var(--ink); }
        .tabs.compact .nav-item .lbl { display: block; }
      }
      .nav-item {
        display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 13px;
        border-radius: var(--r-pill); color: var(--ink-3); font-size: var(--fs-body-s); font-weight: 600;
        white-space: nowrap;
      }
      .nav-item:hover { color: var(--ink); }
      .nav-item.active { background: var(--invert-bg); color: var(--invert-fg); }
      .nav-item .ico { display: grid; place-items: center; width: 15px; }
      /* Settings is a toolbar button, not a tab: it is not a stop on the way to a solved cube. */
      .tb-ctl { width: 32px; height: 32px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
      .tb-ctl:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
      .tb-ctl.active { background: var(--invert-bg); color: var(--invert-fg); }
      /* The smart-cube presence, beside Settings: green and breathing while its position is
         tracked, amber and still when unverified — connected-but-unverified must not wear the
         colour of certainty. Hidden entirely with no cube; paintTrust() owns all three states. */
      .tb-ctl.tb-live { color: var(--ok); }
      .tb-ctl.tb-live .ic { animation: cubusPulse var(--pulse) infinite; }
      .tb-ctl.tb-live.stale { color: var(--warn); }
      .tb-ctl.tb-live.stale .ic { animation: none; }
      /* Windows/Linux caption buttons, drawn by the app because the window has no decorations. */
      .tb-caption { margin-left: 8px; }
      .tb-caption.windows { gap: 0; }
      .tb-caption.linux { gap: 8px; }
      .tb-cap { width: var(--caption-w); height: var(--caption-h); display: grid; place-items: center; color: var(--ink-3); background: none; }
      .tb-cap:hover { background: var(--line); }
      /* OS-owned, not a theme colour: the Windows close red (see tokens.css, "OS-owned colors
         are theme-invariant"). A token would invite theming a colour the OS owns. */
      .tb-cap.close:hover { background: #C42B1C; color: #fff; }
      .tb-cap.round { width: 24px; height: 24px; border-radius: var(--r-pill); background: var(--line); color: var(--ink-2); }
      .tb-cap.round:hover { background: var(--line-strong); }
      .tb-cap.round.close:hover { background: #C42B1C; color: #fff; }
      @keyframes cubusPulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

      .body { flex: 1; display: flex; min-height: 0; }
      /* main column */
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: var(--titlebar-h); }

      /* The stage is the safe content area — what is left after the OS insets and the app's own
         bars — and the size container named `stage` that every screen measures itself against:
         cqw/cqh inside a screen are 1% of the stage's content box, and the orientation switch
         below asks the stage, never the window. position:relative because the popovers are its
         absolutely positioned children (see the popover rule). The padding is a variable so a
         form factor can change it without another rule learning the stage's shape. */
      /* The padding follows the app's width continuously (cqw here is the .app container's — an
         element's own container does not serve its own properties): 24/30 from a 13" Air's
         window up, 12/14 on a phone, no threshold in between. */
      .stage {
        --stage-pad: clamp(12px, 3cqw, 24px) clamp(12px, 3.6cqw, 30px);
        flex: 1; min-height: 0; overflow: hidden; padding: var(--stage-pad);
        position: relative; container-type: size; container-name: stage;
      }
      /* The reference box of the layout contract: a 4:3 box (landscape) or a 3:4 box (portrait)
         fit to the stage's short axis. Screens size their primary region from --ref-w/--ref-h and
         let the sheet take whatever the long axis has beyond it. Declared on .screen, not .stage:
         a container cannot query itself, only its descendants can ask it. */
      .screen { --ref-w: min(100cqw, 100cqh * 4 / 3); --ref-h: min(100cqh, 100cqw * 3 / 4); }
      @container stage (orientation: portrait) {
        .screen { --ref-w: min(100cqw, 100cqh * 3 / 4); --ref-h: min(100cqh, 100cqw * 4 / 3); }
      }
      .screen { display: none; height: 100%; }
      /* A grid of one cell, so the composition box centres on the stage when the fit rule leaves
         paper — an iPad portrait stage is a little wider than 3:4 of its height. */
      .screen.active { display: grid; place-items: center; }

      /* ---- the composition: primary · twin · aux · sheet ------------------------------------ */
      /* The two compositions of the layout contract (dev-docs/stage-contract.md), one DOM. A
         screen is a grid of four regions: `primary` — the cube, or the scan net — locked to the
         reference box; `twin` — the same cube drawn the other way, the 2D net or the
         detected-state cube, a reference to glance at; `aux` — the transport row, present while
         a solution is being walked; and `sheet` — the moves (or the scan's notice and button),
         which take whatever the long axis has beyond the reference box. Landscape: the twin tops
         the column beside the primary and the sheet fills the rest of it, the aux under the
         primary. Portrait: the twin sits BESIDE the cube and the sheet runs under both — so
         every card is on screen at once, without a scroll, at the reference minimums (the
         geometry test asserts it): stacked under the cube the sheet had 190px at the portrait
         minimum, and a solution's chips plus its net need twice that. On a coarse pointer in
         portrait the twin goes back under the moves and the sheet scrolls as a whole: a phone's
         width cannot hold a cube and a net side by side, and its extra height is sheet. Which
         one is the stage's orientation, asked of the stage; nothing measures a width.
         --primary-share is the primary's cut of the reference box's long side — the same cut in
         both orientations, so the cube is the same fraction of the short axis everywhere. */
      .screen { --cols-gap: 22px; --rows-gap: 18px; --primary-share: 0.58; }
      .cols {
        display: grid; min-width: 0; min-height: 0;
        column-gap: var(--cols-gap); row-gap: var(--rows-gap);
        /* Landscape: the reference box is as tall as the stage; the right-hand column takes any
           surplus width (the 1fr): the twin at its content's height, the sheet the rest. */
        width: 100%; height: var(--ref-h);
        --primary-w: calc(var(--ref-w) * var(--primary-share) - var(--cols-gap) / 2);
        grid-template-columns: var(--primary-w) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "primary twin" "primary sheet";
      }
      .cols.walking { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "primary twin" "primary sheet" "aux sheet"; }
      /* List screens have no twin: two columns, each its own scroll, top edges level (an empty
         auto row would still cost its gap and drop the sheet 18px below the column). */
      .cols.flow { grid-template-rows: minmax(0, 1fr); grid-template-areas: "primary sheet"; }
      /* The twin and the sheet are the aside's two children in the DOM — and on the cube screens
         the aside is not a box: `display: contents` hands both straight to the grid, where each
         takes its own area. One DOM for three compositions (landscape, portrait, a finger's
         portrait — which turns the aside back into the scrolling column it is on list screens).
         Declared BEFORE the container blocks: the finger's rule below has the same specificity
         and must win by order, or a stray twin auto-places into an implicit grid column and
         starves the primary of its width. */
      .cols:not(.flow) > .aside { display: contents; }
      .twin { grid-area: twin; min-width: 0; min-height: 0; }
      .sheet { grid-area: sheet; min-width: 0; min-height: 0; }
      @container stage (orientation: portrait) {
        .cols {
          /* Portrait: the reference box is as wide as the stage. The cube and its twin share the
             top row, 3:2; the sheet is the bottom row and any surplus height is its. */
          width: var(--ref-w); height: 100%;
          --primary-h: calc(var(--ref-h) * var(--primary-share) - var(--rows-gap) / 2);
          grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
          grid-template-rows: var(--primary-h) minmax(0, 1fr);
          grid-template-areas: "primary twin" "sheet sheet";
        }
        .cols.walking { grid-template-rows: var(--primary-h) auto minmax(0, 1fr); grid-template-areas: "primary twin" "aux aux" "sheet sheet"; }
        /* Beside the cube the twin centres its picture in the room it has; its heading stays at
           the top, level with the cube card's tools. */
        .twin { display: flex; flex-direction: column; }
        /* width: 100% is load-bearing: a flex item with auto margins is not stretched, and the
           net — a grid whose cells have no size of their own — shrank to 49px without it. */
        .twin .net { width: 100%; margin: auto; }
        .twin .cube-slot { margin: auto 0; }
        /* The scan screen's twin goes beside the SHEET instead: its primary is the cross of six
           tiles, which wants the width, and the detected-state cube is small. The tiles get the
           whole box; the bottom row splits 2:3 between the cube and the notice-plus-button. */
        .cols.twin-low { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); grid-template-areas: "primary primary" "twin sheet"; }
        .cols.twin-low .twin .cube-slot { flex: 1; min-height: 0; height: auto; margin: 6px 0 0; }
        /* List screens (Settings, Stats, Lessons): there is no primary to lock — the first
           column is a list — so the rows take their content's height and the whole box scrolls
           as one, instead of two scroll regions stacked on a phone. Landscape is unchanged: two
           columns, each scrolling. */
        /* align-content: start — a grid's `normal` alignment STRETCHES auto rows across the
           box, so a short list (Lessons' two chapters) was given a row 170px taller than its
           cards, and the sheet below it started after a blank band nothing explained. */
        .cols.flow { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; grid-template-areas: "primary" "sheet"; overflow-y: auto; align-content: start; }
        /* min-height: auto is load-bearing. An `auto` row in an overconstrained box sizes to its
           item's MINIMUM contribution, and with the min-height: 0 the locked layout needs that
           minimum is zero — the rows collapsed and the sheet drew over the column. */
        .cols.flow > .col, .cols.flow > .aside { overflow: visible; min-height: auto; }
      }
      /* A finger, portrait: the phone composition. The aside is a box again and scrolls as a
         whole; the moves come first (the chips are the task, the net is the reference, and a net
         first would put the task under the fold), the twin last at its natural height. */
      @media (pointer: coarse) {
        @container stage (orientation: portrait) {
          .cols:not(.flow) { grid-template-columns: minmax(0, 1fr); grid-template-areas: "primary" "sheet"; }
          .cols.walking { grid-template-areas: "primary" "aux" "sheet"; }
          .cols:not(.flow) > .aside { display: flex; }
          .aside > .twin { order: 1; display: block; }
          .aside > .twin .net { width: auto; margin: 30px auto 0; }
          .aside > .twin .cube-slot, .cols.twin-low .twin .cube-slot { flex: none; height: 230px; margin: 6px 0 0; }
          .aside > .sheet { flex: none; min-height: 0; }
        }
      }
      /* Beside the cube the solution card fills the sheet and its list scrolls inside it (the
         portrait rule above turns both off). A class, not an inline style: an inline `flex:1`
         outranks every stylesheet rule, and the portrait sheet could not un-flex it. */
      .solution-card { flex: 1; min-height: 140px; display: flex; flex-direction: column; }
      .primary { grid-area: primary; min-width: 0; min-height: 0; }
      .aux { grid-area: aux; min-width: 0; }
      .scan-sheet { display: flex; flex-direction: column; gap: 16px; }
      .state-card .net { margin: 30px auto 0; }
      #scanCube { height: 230px; margin-top: 6px; }
      /* `overflow-y: auto` is not optional here: .stage clips, and no column scrolled. Settings can
         now list up to 32 remembered cubes, so past a certain number the controls below them were
         simply unreachable — clipped off the bottom with no way to scroll to them. */
      .col { grid-area: primary; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
      .aside { grid-area: sheet; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
      /* Nothing in a sheet squashes. The sheet is a flex column that SCROLLS, and a flex item is
         shrunk before its container scrolls — so a 40px button at the foot of an overfull sheet
         was shrunk to 0px: the Restore screen's "Solve this cube" vanished in every portrait
         fixture, while the notice beside it said to press it. A card is protected by its content's
         minimum height; a button is not. The geometry test now counts a zero-height control as a
         failure instead of filtering it out as "not visible". */
      .aside > * { flex-shrink: 0; }

      /* ---- primitives ----------------------------------------------------- */
      /* Flat on purpose: no fill, no outline. The leading pane is the only raised surface; a card
         is a spacing unit whose contents sit straight on the window paper. That puts eyebrow labels
         on --bg rather than --panel, which is the surface --ink-5 is tuned against (tokens.css). */
      .card { border-radius: var(--r-5); padding: 16px 18px; }
      .card.tight { padding: 0; overflow: hidden; }
      .stat .v { font-family: var(--font-num); font-size: var(--fs-display); font-weight: 600; letter-spacing: -.02em; }
      .stat .d { font-size: var(--fs-body-s); color: var(--ink-4); }
      /* Intrinsic wrapping, not a breakpoint: as many 150px stat cards as fit, three on the
         desktop reference, two on a phone. A `.v` at --fs-display needs ~130px. */
      .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
      /* Trainer cases: as many 140px cards as the width holds — five at the reference, two on a
         phone. */
      .case-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; align-content: start; }
      /* A row of controls that wraps rather than overflows — the theme pills beside their
         description, the trainer's filters beside their caption, the timer's last five. */
      .wrap-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      /* The timer's clock: 150px at the reference, and never wider than the stage — "12.34" in
         the mono stack is ~3.6 characters of width, so 24cqw keeps it inside a phone. */
      .timer-clock { font-size: clamp(48px, 24cqw, var(--fs-timer)); font-weight: 600; line-height: .95; letter-spacing: -.03em; cursor: pointer; }
      /* One rule for the whole document, ahead of every component. Any class that sets `display`
         beats the user-agent [hidden] rule, so each component that needed hiding had grown its own
         [hidden] override — six of them — and the two buttons this branch added were left out.
         Two buttons were therefore visible the whole time, each offering an action before it
         had been earned.
         A seventh per-component rule would have fixed today's instance and left the next one to be
         found the same way, so the six are gone and this stands in their place. */
      [hidden] { display: none !important; }
      /* Every action button is a pill — one shape across the app, the same one the tabs wear.
         Decided 2026-08-27, superseding the mock's --r-4 rectangles: two button shapes on one
         screen read as two kinds of thing, and there is only one kind. */
      .btn { height: 40px; padding: 0 18px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 8px; justify-content: center; font-size: var(--fs-body-l); font-weight: 600; }
      .btn.primary { background: var(--invert-bg); color: var(--invert-fg); }
      .btn.outline { border: 1px solid var(--line-strong); color: var(--ink-2); }
      .btn.accent-outline { border: 1px solid var(--accent); color: var(--accent); }
      .btn.sm { height: 32px; padding: 0 12px; font-size: var(--fs-body-s); }
      .btn.block { width: 100%; }
      .pill { border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 15px; font-size: var(--fs-body); font-weight: 600; color: var(--ink-3); }
      .pill.on { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
      .bar { height: 6px; background: var(--panel-sunk); border-radius: var(--r-pill); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .toggle { width: 40px; height: 22px; border-radius: var(--r-6); background: var(--track); position: relative; flex: none; }
      .toggle.on { background: var(--accent); }
      /* The knob's shadow is a literal: an 18px knob floats a millimetre, and the elevation
         tokens are surface-scale (cards, popovers, windows). Named in the discipline test. */
      .toggle > i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left var(--fade); }
      .toggle.on > i { left: 20px; }
      svg.ic { width: 1em; height: 1em; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* cube slot */
      .cube-slot { width: 100%; height: 100%; min-height: 220px; display: block; }
      cubus-cube { display: block; width: 100%; height: 100%; }

      /* card header/list */
      .card-h { padding: 14px 18px 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--panel-sunk); }
      /* The solution/scramble card: its header sits directly over the move chips, which carry
         their own borders — a rule between the two reads as clutter, not structure. Cards whose
         header tops a list of borderless rows (Recent solves) keep the divider. */
      .card-h.bare { border-bottom: 0; }
      .card-h b { font-size: var(--fs-body-l); font-weight: 700; }
      /* An eyebrow with a tool on the same line. align-items:center is what makes the icon line up
         with the label; the negative margin keeps a 28px button from inflating an 15px row. */
      .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      /* The state card's heading, styled like the Solution/Scramble card's (.card-h b) rather
         than as an all-caps eyebrow — the two cards sit stacked and should speak in one voice. */
      .state-h { font-size: var(--fs-body-l); font-weight: 700; }
      .eyebrow-row > button { width: 28px; height: 28px; margin: -6px -4px -6px 0; border-radius: var(--r-3); display: grid; place-items: center; color: var(--ink-5); }
      .eyebrow-row > button:hover { background: var(--panel-sunk); color: var(--ink-2); }
      .list { flex: 1; min-height: 0; overflow-y: auto; }
      .row { display: grid; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--line-faint); font-size: var(--fs-body); }
      .link { color: var(--accent); font-size: var(--fs-body-s); }
      /* Text input for the smart-cube card (MAC address, nicknames). Mono, because addresses are
         the kind of string a person compares character by character. */
      .field { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-3); padding: 7px 10px; font-family: var(--font-num); font-size: var(--fs-body-s); }
      /* The About card: the app's own mark heading a short table of facts. Row icons are the same
         inline set as everywhere else; the key column is fixed so the values align. */
      .about-brand { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-family: var(--font-num); font-size: var(--fs-title-s); }
      .about-brand img { display: block; }
      .about-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: var(--fs-body-s); }
      .about-row .ic { color: var(--ink-5); flex: none; }
      .about-row .k { color: var(--ink-4); width: 62px; flex: none; }
      .about-row a.link { text-decoration: none; }
      .about-row a.link:hover { text-decoration: underline; }

      /* camera scan.
         The pane owns the whole six-face flow. <ai-scan-panel headless autostart> sits inside it
         invisibly, owning only the camera + model, and reports through `scan-progress`; the scan
         is drawn HERE, in the app's own type and colour. The raw camera picture is deliberately
         never shown — what the user needs to see is what the scanner READ, not what the lens saw,
         and the live 3×3 below is exactly that. */
      .scanboard { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-9); text-align: center; }
      /* The scanner speaks through the aside card rather than a status line under the tiles: one
         voice instead of a caption competing with an explanation that says the same thing. */
      .scan-say { color: var(--ink-4); }
      .scan-say.ok { color: var(--ok); }
      .scan-say.err { color: var(--err); }
      /* The transient camera hint ("hold still…", "show the whole face…"), shown UNDER a pinned
         notice rather than in place of it — the pin is the whole point: an explanation must not be
         overwritten by whatever the camera sees 60 ms later. */
      .scan-hint { color: var(--ink-5); font-size: var(--fs-caption); margin-top: 8px; }
      /* The six sides laid out as the cube's net — U above F, D below it, L R B across the middle
         row — so the tiles sit where the faces do. With every tile edged in its neighbours'
         colours, touching tiles now show each other's colour across the join, which is what makes
         the arrangement worth more than a row: the net is self-explaining. */
      /* Row gap far tighter than the column gap on purpose: the label under each tile already adds
         vertical space, and without compensating the three rows read as three rows instead of a
         cross. */
      /* Full width of the primary region, capped: at the 840×630 reference the region is 501px
         wide and the tiles 109px, and the cap keeps a 1280-wide window from drawing 160px tiles
         for the sake of it. A touch iPad in landscape lands between (34px stickers on an 11",
         57 on a 13") — the one control this sheet leaves under the 44px floor, and the geometry
         test names the number it holds instead. */
      .scan-faces { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 10px; row-gap: 2px; }
      /* The cross is the cube's shape, and it is the same cross in both windows: with a mouse
         the six tiles are laid out as the net in portrait too (decided 2026-08-28 — one large
         face over a strip of five read as a different screen, and a portrait window is not a
         phone). The strip exists for ONE reason, a finger: six 3×3 tiles cannot give it 44px
         stickers in a phone's width. So under a coarse pointer in portrait ONE face is large —
         the one app.js marks .focus: the side the scanner asks to see again, else the side it
         just read, else the one you tap — and the other five are a strip below it, status at a
         glance and a tap target each (the tile, not its stickers, at that size). The large tile
         is sized off the reference box so it, its label and the strip fit the primary region:
         --ref-h × --primary-share is the region, and 140px is the strip, the label and the gaps.
         The --focus flag is how app.js knows a tap on a strip tile means "show me this one"
         rather than "correct this sticker". Everywhere else the .focus class is inert. */
      @media (pointer: coarse) {
      @container stage (orientation: portrait) {
        .scan-faces { --focus: 1; max-width: none; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: auto auto; column-gap: 8px; row-gap: 8px; }
        /* Three class-level parts, to outrank the cross placement (.scan-face[data-face="U"] …)
           declared below this block. */
        .scan-faces .scan-face[data-face] { grid-area: auto; }
        .scan-faces .scan-face.focus { grid-column: 1 / -1; grid-row: 1; align-items: flex-start; }
        /* The large tile sits at the LEFT of its row, its label centred under it: the card's tools
           (reset / paint / camera) park in the top-right corner, and a centred tile ran under
           them. The same expression sizes tile and label so the label knows the tile's width. */
        .scan-face.focus { --focus-w: min(100%, 320px, calc(var(--ref-h) * var(--primary-share) - 140px)); }
        .scan-face.focus .tile { width: var(--focus-w); }
        .scan-face.focus .lbl { width: var(--focus-w); text-align: center; }
        .scan-face:not(.focus) { cursor: pointer; }
        .scan-face:not(.focus) .lbl { font-size: var(--fs-micro); }
        .scan-face:not(.focus) .tile { border-width: 2px; padding: 3px; }
        .scan-face:not(.focus) .tgrid { gap: 1px; }
        .scan-face:not(.focus) .tgrid > .cell { border-radius: var(--r-1); } /* strip cells are a third the size; the sticker corner follows */
        .scan-face:not(.focus) .tgrid > .cell:nth-child(5) > .ic { display: none; }
        /* Strip cells are NOT tap targets — the TILE is (its whole face brings the side forward),
           which is what lets the strip live below the 44px floor. pointer-events makes that true
           at the hit-testing level: a finger can only ever hit the tile. Keyboard activation is
           not hit-tested, so Enter on a strip cell still brings its side forward. */
        .scan-face:not(.focus) .tgrid > .cell { pointer-events: none; }
      }
      }
      .scan-face[data-face="U"] { grid-area: 1 / 2; }
      .scan-face[data-face="L"] { grid-area: 2 / 1; }
      .scan-face[data-face="F"] { grid-area: 2 / 2; }
      .scan-face[data-face="R"] { grid-area: 2 / 3; }
      .scan-face[data-face="B"] { grid-area: 2 / 4; }
      .scan-face[data-face="D"] { grid-area: 3 / 2; }
      .scan-face { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      /* The four edges are painted in the NEIGHBOURING faces' colours (set inline — they follow the
         chosen palette), which tells the user which way up to hold that side without a caption.
         Solid, not dashed: four dashed colours are unreadable at this size. Captured vs pending is
         carried by the cells and the label, which is signal enough without spending the border. */
      /* The hairline outside the border is load-bearing, not decoration: four of the six faces have
         WHITE on top, and a white edge on a cream card is invisible without it — which would hide
         the single most common instruction ("hold white up"). The edge colours stay at full
         strength on pending tiles too; those are the sides still to be shown, so they need the
         guidance most. Dimness is carried by the cells alone. */
      /* Rows are declared, not left implicit. Implicit rows are auto-sized, so they were only equal
         while every cell was empty — putting a glyph in the centre gave the middle row a content
         height and stretched that whole row (33/48/33 instead of 38/38/38). A sticker grid must be
         square whatever a cell happens to contain. */
      .scan-face .tile { width: 100%; aspect-ratio: 1; padding: 6px; border-radius: var(--r-5); border: 3px solid var(--line-strong); box-shadow: 0 0 0 1px var(--line); display: grid; }
      /* The 3x3 grid lives on an inner wrapper, NOT on the tile: when a scan settles, a face that
         was captured the wrong way up is animated turning to its true orientation, and rotating
         the tile itself would carry its edge colours along — which are canonical guidance and must
         stay put. The wrapper rotates; the border stays. */
      .scan-face .tgrid { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 3px; transform-origin: 50% 50%; }
      /* A dark hairline and a soft top-down bevel on every sticker. White is the one facelet
         colour that shares a value with the warm-paper tile behind it, so without an edge it has
         no boundary at all and reads as a hole rather than as a sticker. The 2D net
         (.net .sticker) has carried the same hairline since it shipped; this brings the scan grid
         into line with it — and since 2026-08-28 the value IS the net's, through one token
         (--sticker-edge), because "into line" had quietly meant three different blacks: the net's
         .28, this grid's .32 and the swatch picker's .22. One token, so they cannot drift apart
         again.
         The bevel is a background-image, NOT an inset box-shadow: the hover ring, the editing ring
         and the centre's own hover ring all set box-shadow, and any of them would wipe an inset
         out. Painting a cell sets style.backgroundColor inline, which overrides only the colour —
         so the gradient survives, and reads against every one of the six. */
      /* A sticker is a BUTTON since 2026-08-28 — the keyboard path the pointer path always had.
         padding/appearance strip the UA's button chrome; cursor: default undoes the global
         button pointer, because a cell only wears one when a press will be heard (the gated
         rules below). */
      .scan-face .tgrid > .cell {
        border-radius: var(--r-sticker); background-color: var(--facelet-off); opacity: .3;
        border: 1px solid var(--sticker-edge); padding: 0; appearance: none; cursor: default;
        background-image: linear-gradient(180deg, rgba(255,255,255,.26), rgba(0,0,0,.10));
      }
      .scan-face .lbl { font-size: var(--fs-caption); font-weight: 700; letter-spacing: .03em; color: var(--ink-5); }
      /* Every sticker but the centre is correctable, on every side. */
      /* Outer stickers are clickable only when a click will be HEARD: on a read side (correcting
         a reading) or in paint mode (supplying one). A pointer on a pending side promised an
         edit the handler rejects. */
      :is(.scan-face.done, .painting .scan-face) .tgrid > .cell:not(:nth-child(5)) { cursor: pointer; }
      /* .editing is excluded: this hover ring outweighs the editing halo in the cascade, and a
         clicked sticker must keep wearing the accent halo while the pointer is still on it. */
      :is(.scan-face.done, .painting .scan-face) .tgrid > .cell:not(:nth-child(5), .editing):hover { box-shadow: 0 0 0 2px var(--ink); opacity: 1; }
      /* The centre names the face, so it cannot be recoloured; it re-reads the side instead.
         It must show its TRUE colour: it is the one sticker whose colour is certain, and the eight
         around it are read against it. An earlier version laid a 30% black scrim over it to keep
         the glyph legible, which made every centre render as a darkened version of itself and read
         as a seventh colour the cube does not have.
         The glyph carries its own contrast instead — a dark halo under a white mark reads on all
         six colours, and tints none of them. */
      .scan-face .tgrid > .cell:nth-child(5) { display: grid; place-items: center; }
      .scan-face .tgrid > .cell:nth-child(5) > .ic {
        opacity: 0; color: #fff; transition: opacity var(--fade);
        filter: drop-shadow(0 0 1px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.55));
      }
      /* Shown, not hidden behind a hover: it is how a user learns the centre re-reads its side, and
         it appears exactly when that is possible — once the side has been read. Hover uses the same
         outline ring the other stickers use, rather than darkening the swatch. */
      .scan-face.done .tgrid > .cell:nth-child(5) { cursor: pointer; }
      .scan-face.done .tgrid > .cell:nth-child(5) > .ic { opacity: .92; }
      .scan-face.done .tgrid > .cell:nth-child(5):hover { box-shadow: 0 0 0 2px var(--ink); }
      .scan-face.done .tgrid > .cell:nth-child(5):hover > .ic { opacity: 1; }
      /* The scan settling: once the cube reads as solvable its true orientation is known, and any
         face captured the wrong way up TURNS to it — the .tgrid rotates (transition set inline,
         duration matched to the angle, deliberately unhurried), then the repaint lands in the same
         frame the transform resets, so the content never visibly jumps. */
      .scan-face .cell.editing { box-shadow: 0 0 0 2px var(--accent); }
      /* The sticker a colour misread most plausibly landed on — fixing it makes the cube legal.
         Pulses in the error colour so it reads as "look here", distinct from the accent halo an
         asked side wears. Full opacity even on an un-hovered cell: a suspect is being pointed at. */
      .scan-face .tgrid > .cell.suspect { opacity: 1; box-shadow: 0 0 0 2px var(--err); animation: cubusSuspect var(--pulse-alert) ease-in-out infinite; }
      /* A suspect being EDITED wears the editing halo, still: without this the later suspect rule
         won the cascade and the active-edit indicator vanished on the one sticker most likely to
         be edited. */
      .scan-face .tgrid > .cell.suspect.editing { animation: none; box-shadow: 0 0 0 2px var(--accent); }
      @keyframes cubusSuspect { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--err) 40%, transparent); } }

      /* ONE popover idiom. .swatches (the sticker colour picker) and .menu (camera, speed) are
         the same surface: absolutely positioned children of the stage, placed and clamped by
         app.js in stage coordinates. They used to be fixed to the viewport; under the layout
         contract a popover belongs on the stage — on a phone the viewport also holds the OS
         insets and the app's bars — and on the declared WebKit floor (Safari 16) a size container
         still implies layout containment, which would have made the stage the containing block of
         a "fixed" descendant anyway, and its overflow:hidden the clip. Absolute says what happens.
         The max-height + scroll here is the pre-measurement bound; app.js sets the real one from
         the room there is. */
      :is(.swatches, .menu) { position: absolute; z-index: 60; border-radius: var(--r-4); background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow-raise); max-height: calc(100cqh - 16px); overflow-y: auto; }
      /* Colour picker for a misread sticker — layout only; the surface comes from the rule above.
         The chips wear the sticker hairline (they offer sticker colours) but the CONTROL radius,
         not --r-sticker: they are buttons, and at 30-44px the sticker corner reads too sharp. */
      .swatches { display: flex; gap: 6px; padding: 8px; }
      .swatches > button { width: 30px; height: 30px; border-radius: var(--r-3); box-shadow: inset 0 0 0 1px var(--sticker-edge); }
      .swatches > button:hover { transform: scale(1.08); }
      .swatches > button.now { box-shadow: inset 0 0 0 1px var(--sticker-edge), 0 0 0 2px var(--ink); }
      /* When the picker opens on a suspect sticker, the colour that would make the cube legal is
         ringed in the same error colour the suspect pulses in — the suggestion, not a selection. */
      .swatches > button.suggest { box-shadow: inset 0 0 0 1px var(--sticker-edge), 0 0 0 2px var(--err); }
      .scan-face.done .tgrid > .cell { opacity: 1; }
      .scan-face.done .lbl { color: var(--ok); }
      /* The side the scanner is waiting to be shown again, to settle a reading it cannot settle
         from the six captures alone. Outranks .done: it has been captured, that is the point. */
      /* Keeps its edge colours: the point of asking is that this side be held a particular way up,
         which is exactly what those colours say. The halo carries the attention instead. */
      .scan-face.asked .tile { box-shadow: 0 0 0 1px var(--line), 0 0 0 4px color-mix(in srgb, var(--accent) 32%, transparent); }
      .scan-face.asked .lbl { color: var(--accent); }
      /* Camera control, out of the centred column so it does not shift the scan. The lens fills and
         pulses while a camera is open: with no video on screen, that is the only thing telling a
         user the camera is actually running. */
      /* Tools parked in a card's top-right corner: the scan screen's camera/paint/reset group and
         the cube screen's speed menu. The card must be position:relative. */
      .card-tools { position: absolute; top: 12px; right: 14px; z-index: 2; display: flex; align-items: center; gap: 2px; }
      .card-tools > button { width: 34px; height: 34px; border-radius: var(--r-4); display: grid; place-items: center; color: var(--ink-5); }
      .card-tools > button:hover { background: var(--panel-sunk); color: var(--ink-2); }
      .card-tools > button.open { background: var(--panel-sunk); color: var(--ink); }
      .scan-cam.on #scanCamBtn { color: var(--ok); }
      /* Asking whether the cube's own report matches the cube in your hands. Sits directly under the
         2D net, because the net is what you compare against — it shows all six sides at once,
         where the 3D twin shows three and the other half is a guess. */
      /* Painting is a mode, so it reads as held down rather than as a nudge, and the camera dims
         beside it — the two cannot both be true. */
      .scan-cam.paint #scanPaintBtn { background: var(--accent); color: var(--on-accent); }
      .scan-cam.paint #scanCamBtn { opacity: .45; }
      .scan-cam.on #scanCamBtn .lens { fill: currentColor; animation: cubusPulse var(--pulse) infinite; }
      /* A menu, not a native <select>: the webcam button is the only control in that corner, and a
         dropdown that has to sit beside it defeats the point. Same popover treatment as the sticker
         colour picker below. */
      .menu { min-width: 190px; padding: 5px; } /* surface comes from the shared popover rule */
      .menu > button { display: block; width: 100%; padding: 7px 10px; border-radius: var(--r-3); text-align: left; font-size: var(--fs-body-s); color: var(--ink-2); white-space: nowrap; }
      .menu > button:hover { background: var(--panel-sunk); color: var(--ink); }
      .menu > button.now { font-weight: 700; color: var(--ink); }
      .menu > button.now::before { content: '✓ '; color: var(--ok); }
      .menu > hr { height: 1px; border: 0; margin: 5px 6px; background: var(--line); }

      /* Transport on the cube screen, all on one line: four buttons (back, repeat, next, play), the
         progress bar, and the step count.
         Speed is not here — it lives in the cube card's corner, because it is a preference you set
         once rather than part of walking the solution. */
      /* One line down to the contract's portrait floor, by arithmetic. A finger is the tight
         case: four 44px buttons, the 22px done mark and the 56px count are 254px, and six 4px
         gaps plus the bar's 32px basis (the touch floors below set both) make 310 — an iPhone
         SE's transport is 315 wide. A mouse keeps the 6px gaps and the 48px basis: 338, against
         403 in the narrowest fine-pointer transport (the desktop landscape aux column). Below
         the floor (a 320px iPad Split View column has 260) the row wraps and the bar, the one
         flexible thing in it, drops to a second line rather than the row running off the card. */
      .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      /* Takes the old spacer's job: it has to be the flexible gap anyway, so the gap may as well
         say how far through the solution you are. --track/--bar are the groove/fill token pair. */
      .transport .progress { flex: 1 1 48px; height: 6px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
      .transport .progress > span { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: var(--bar); transition: width var(--fade) ease; }
      /* The off-track note lives at the FOOT OF THE SOLUTION CARD, and that placement is the fix,
         not a preference: in the transport row it resized the cube card above on every stray turn,
         flashing the whole page. Here it takes its space from #solList, which flexes and scrolls. */
      .follow-note { display: flex; flex-direction: column; align-items: stretch; gap: 8px; flex: none; padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: var(--fs-body-s); color: var(--warn); }
      .follow-note .acts { display: flex; gap: 8px; }
      /* The pause line: information, not a warning — and no rescue buttons, because pausing is a
         choice, not a fault. */
      .follow-note.info { color: var(--ink-4); }
      .follow-note.info .acts { display: none; }
      /* Transport controls are glyphs, not boxes. Four outlined squares in a row read as a toolbar
         of equal-weight objects and fight the cube for attention; the icons alone say the same
         thing. Play carries its emphasis in ink weight rather than a filled box.
         Hover gets a soft ground — the same affordance .card-tools uses — so there is feedback
         without a border sitting there permanently.
         44px on EVERY pointer, not only under the coarse floors (decided 2026-08-28): this row
         is driven mid-solve, usually with a cube in the other hand, and the desktop window is
         also the preview of the touch layouts. The box is the finger's; the glyph keeps its
         size — the same look the touch floors already gave a tablet. */
      .tbtn { width: 44px; height: 44px; border-radius: var(--r-4); display: grid; place-items: center; color: var(--ink-3); }
      .tbtn:hover { background: var(--panel-sunk); color: var(--ink); }
      .tbtn.primary { color: var(--ink); }
      .tbtn[disabled] { opacity: .3; }
      .tbtn[disabled]:hover { background: none; color: var(--ink-3); }
      .pill[disabled] { opacity: .4; cursor: default; }
      .pill[disabled]:hover { background: none; }
      /* Whatever else joins the transport row — the Follow-cube pill, Scramble's "Solve this
         scramble" — is a control in the same row and gets the same 44px, mouse or finger.
         min-height, so each keeps its own drawn shape and padding. */
      .transport button { min-height: 44px; }
      /* Shown only when the last move lands, in the transport row just before the step count — the
         count's own tick. It was a 46px badge over the cube, which said "done" where the count
         already read 22 / 22, and covered the cube to say it. */
      .done-mark { flex: none; width: 22px; height: 22px; border-radius: var(--r-pill); display: inline-grid; place-items: center; color: var(--on-accent); background: var(--ok); }

      /* 2D net */
      .net { display: grid; grid-template-columns: repeat(12,1fr); grid-template-rows: repeat(9,1fr); gap: 3px; aspect-ratio: 12/9; max-width: 320px; margin: 0 auto; }
      .net .face { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 2px; }
      .net .sticker { border-radius: var(--r-sticker); border: 1px solid var(--sticker-edge); transition: background var(--fade); }
      /* The rules that actually paint the net. buildNet sets `class="sticker U"` and applyNetColors
         sets --net-U..B, but nothing joined the two, so every net has rendered as empty outlines
         since it was written — visible now that the cube screen shows one next to the 3D twin. */
      .net .sticker.U { background: var(--net-U); }
      .net .sticker.R { background: var(--net-R); }
      .net .sticker.F { background: var(--net-F); }
      .net .sticker.D { background: var(--net-D); }
      .net .sticker.L { background: var(--net-L); }
      .net .sticker.B { background: var(--net-B); }
      /* A grid of fixed --chip tracks, as many as fit, justified edge-to-edge — so the first
         column sits flush with the heading and the last column flush with the count above, and a
         column can never be clipped: auto-fill computes what fits instead of letting wrap guess. */
      /* gap is the MINIMUM breathing room — auto-fill counts columns against --chip + 6px, so the
         chips can never pack edge-to-edge; space-between then distributes whatever is left on top,
         keeping the first column flush left and the last flush right. row-gap alone was the bug:
         with no column-gap, auto-fill fit an extra column and left ~2px between chips. */
      .move-chips { display: grid; grid-template-columns: repeat(auto-fill, var(--chip)); justify-content: space-between; gap: 6px; }
      /* One shape for every move: a SQUARE, text centred both ways at body size. 36px with a
         mouse — the size that lets a whole solution sit on the sheet at the reference minimums
         without a scroll (25 moves are three rows on the portrait sheet, five in landscape) — and
         the 44px tap target for a finger (the touch floors below), where the box grows for the
         finger, not the type. Equal boxes are what let a solution read as a row of steps rather
         than a ragged sentence. */
      .screen { --chip: 36px; }
      .chip-m { font-family: var(--font-num); font-size: var(--fs-body-l); font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink-5); border-radius: var(--r-2); width: var(--chip); height: var(--chip); padding: 0; display: inline-flex; align-items: center; justify-content: center; }
      .chip-m.played { background: var(--panel-sunk); color: var(--ink); }

      /* ---- touch floors ----------------------------------------------------------------- */
      /* On a coarse pointer every control is at least 44px — Apple's floor, and the contract's
         (dev-docs/stage-contract.md). A pointer feature, not a width: a desktop portrait window
         is a mouse, an iPad in landscape is a finger. The transport keeps one line at the 375px
         floor by the same arithmetic as its own rule, with the buttons at 44:
         4×44 + 22 + 56 + 6×4 + 32 = 310 ≤ 315. The toggle keeps its drawn size — its knob
         geometry is fixed numbers — and grows a 44px hit area around it instead. */
      @media (pointer: coarse) {
        .screen { --chip: 44px; }
        .btn, .tbtn, .tb-ctl, .card-tools > button, .pill, .menu > button, .nav-item, .swatches > button, .field { min-height: 44px; }
        .tbtn, .tb-ctl, .card-tools > button, .swatches > button { min-width: 44px; }
        .eyebrow-row > button { width: 44px; height: 44px; margin: -14px -12px -14px 0; }
        .toggle::before { content: ''; position: absolute; inset: -11px -2px; }
        .transport { gap: 4px; }
        .transport .progress { flex-basis: 32px; }
      }
      .chip-m:hover { border-color: var(--ink-5); color: var(--ink); }
      .chip-m.cur:hover { border-color: var(--invert-bg); color: var(--invert-fg); }
      .chip-m.cur { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }

    </style>
  </head>
  <body>
    <div class="app">
      <div class="win">
        <!-- "deep" makes the whole bar a drag handle, wordmark included; Tauri's drag script
             exempts buttons on its own, which is what keeps the window controls clickable. app.js
             fills the two zones per platform (buildChrome). The screen's name is not drawn here —
             the filled tab is the name — but app.js still sets the window title, which is what
             the taskbar, the window switcher and a browser tab show. -->
        <div class="titlebar" id="titlebar" data-tauri-drag-region="deep">
          <div class="tb-zone" id="tbLead"></div>
          <div class="tb-zone tb-trail" id="tbTrail"></div>
        </div>

        <div class="body">
          <!-- main -->
          <div class="main">
            <div class="stage" id="stage"><!-- screens injected here --></div>
          </div>
        </div>

        <!-- The tabs (renderNav) are the window's own child, not the bar's: in landscape the
             stylesheet floats them over the bar's centre line, in portrait they are this row at
             the foot of the window — one DOM, two chromes (see the .tabs rules). -->
        <nav class="tabs" id="nav" aria-label="Screens"></nav>
      </div>
    </div>

    <script type="module" src="./vendor/cubus-cube.js"></script>
    <!-- AI camera scanner (YOLOv11): registers <ai-scan-panel>, which the Restore screen
         mounts headless + autostart. It owns the camera and onnxruntime-web (model + wasm from
         ./vendor/) and reports through `scan-progress`; the screen draws the scan itself. -->
    <script type="module" src="./vendor/ai-scan-panel.js"></script>
    <script type="module" src="./lib/app.js"></script>
  </body>
</html>
