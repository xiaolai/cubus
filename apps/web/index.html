<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cubus</title>
    <!-- Icons. All generated from dev-docs/design/icons/cubus-icon-flat.svg by
         scripts/build-icons.sh — see dev-docs/icons.md. icon.svg is listed first so
         browsers that support it skip the rasters entirely; favicon.ico stays for the
         address bar and for anything that still asks for /favicon.ico by convention.
         apple-touch-icon is deliberately opaque: iOS composites a transparent one
         against black, which rings the tile. -->
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241F18" media="(prefers-color-scheme: dark)" />
    <!-- No web fonts, by decision (2026-08-27): tokens.css names system stacks only, so the page
         loads NOTHING remote — the offline test enforces zero exceptions now that the Google
         Fonts stylesheet, the one accepted gap, is gone. -->
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      /* App shell + screens. Colours/space/type all come from tokens.css (the approved design
         system); this file only arranges them. Cube sticker colours live in cubus-cube.js. */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      /* Chrome is not a document. Clicking a sticker, a nav item or a button placed a real text
         caret (getSelection().type === 'Caret') inside it; Chrome does not paint one, but the
         WKWebView the desktop app runs in does, so clicking a cube face blinked an insertion point
         in it. Selection is restored below for real form controls: a text input you cannot put a
         cursor in is broken. It used to be restored for .mono, the raw facelet string, but both
         screens that printed one dropped it, so that exception guarded nothing and is gone. */
      body { user-select: none; -webkit-user-select: none; }
      input, select, textarea { user-select: text; -webkit-user-select: text; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--font-ui); font-size: var(--fs-body); line-height: var(--lh-body);
        -webkit-font-smoothing: antialiased;
      }
      /* The window IS the OS window — no fake desk/frame (paper-one WindowShell). The app draws its
         own title bar on every platform, and the bar is the navigation: the tabs sit in it, so
         there is no leading pane. macOS overlays it on the OS bar (the real traffic lights are
         painted over it); Windows and Linux windows are created without decorations
         (tauri.windows.conf.json / tauri.linux.conf.json), so the caption buttons drawn here are
         the only ones there are. --titlebar-h is the clearance .main leaves for the bar. */
      :root { --titlebar-h: var(--titlebar-other); }
      html[data-platform="macos"] { --titlebar-h: var(--titlebar-macos); }
      .num { font-family: var(--font-num); } /* the system mono stack — every numeral, time, alg */
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; }
      button:disabled { opacity: .5; cursor: default; }
      .eyebrow { font-size: var(--fs-meta); font-weight: 700; letter-spacing: .13em; color: var(--ink-5); text-transform: uppercase; }

      /* ---- window + title bar --------------------------------------------- */
      .app { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
      .win { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
      /* The title bar is the app's toolbar (paper-one TitleBar, with the navigation moved into it).
         Three zones on a 1fr/auto/1fr grid, so the tabs sit on the window's centre line whatever
         the lead and trail zones weigh: macOS leads with the traffic-light gap and the wordmark
         and trails with Settings; Windows/Linux lead with the wordmark and trail with Settings and
         the caption buttons. The bar is transparent — it sits on the paper like everything else.
         `data-tauri-drag-region="deep"` on the bar makes its whole subtree a drag handle; Tauri's
         drag script exempts buttons on its own, which is what keeps the tabs clickable without
         opting each one out. */
      .titlebar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 5;
        height: var(--titlebar-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 0 12px;
      }
      .tb-zone { display: flex; align-items: center; gap: 4px; min-width: 0; }
      .tb-trail { justify-content: flex-end; }
      /* The traffic-light gap. The OS paints the real lights at trafficLightPosition; in a browser
         preview (?chrome=preview) three dots stand in. */
      /* padding-left + the titlebar's 12px padding + half a dot = the real close button's CENTRE.
         The truth is measured, not designed: Finder's tall-toolbar lights centre at 25.75pt on
         this macOS, so tauri.conf.json says x:19 (centre = x + 6.75) and the preview dots match:
         12 + 7.75 + 6 = 25.75. */
      .tb-lights { display: flex; align-items: center; flex: 0 0 var(--sys-zone-macos); gap: var(--light-gap); padding-left: 7.75px; }
      .tl { width: var(--light-size); height: var(--light-size); border-radius: var(--r-pill); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
      /* The mark is icons/icon.svg — the transparent variant, so it reads on the paper in both
         themes without a tile behind it. */
      .brand { display: flex; align-items: center; gap: 7px; padding: 0 6px; }
      .brand .mark { flex: none; width: 20px; height: 20px; display: block; }
      .brand b { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-title-s); letter-spacing: -.01em; }

      /* The tabs: a segmented control in the macOS/iOS manner — one capsule, the current screen
         filled in ink. Four screens by default and never more than eight, which is why they fit
         here, and why the pane they replaced was a column of mostly empty space. The capsule's
         ground is mixed from --ink so it reads as a slight well in both themes without a token
         of its own. */
      .tabs { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--ink) 7%, transparent); }
      .nav-item {
        display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 13px;
        border-radius: var(--r-pill); color: var(--ink-3); font-size: var(--fs-body-s); font-weight: 600;
        white-space: nowrap; transition: background var(--fade), color var(--fade);
      }
      .nav-item:hover { color: var(--ink); }
      .nav-item.active { background: var(--invert-bg); color: var(--invert-fg); }
      .nav-item .ico { display: grid; place-items: center; width: 15px; }
      /* Settings is a toolbar button, not a tab: it is not a stop on the way to a solved cube. */
      .tb-ctl { width: 32px; height: 32px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); transition: background var(--fade), color var(--fade); }
      .tb-ctl:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
      .tb-ctl.active { background: var(--invert-bg); color: var(--invert-fg); }
      /* Windows/Linux caption buttons, drawn by the app because the window has no decorations. */
      .tb-caption { margin-left: 8px; }
      .tb-caption.windows { gap: 0; }
      .tb-caption.linux { gap: 8px; }
      .tb-cap { width: var(--caption-w); height: var(--caption-h); display: grid; place-items: center; color: var(--ink-3); background: none; }
      .tb-cap:hover { background: var(--line); }
      .tb-cap.close:hover { background: #C42B1C; color: #fff; }
      .tb-cap.round { width: 24px; height: 24px; border-radius: var(--r-pill); background: var(--line); color: var(--ink-2); }
      .tb-cap.round:hover { background: var(--line-strong); }
      .tb-cap.round.close:hover { background: #C42B1C; color: #fff; }
      @keyframes cubusPulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

      .body { flex: 1; display: flex; min-height: 0; }
      /* main column */
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: var(--titlebar-h); }
      .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--invert-bg); color: var(--invert-fg); display: grid; place-items: center; font-size: var(--fs-body-s); font-weight: 700; }

      .stage { flex: 1; min-height: 0; overflow: hidden; padding: 24px 30px; }
      .screen { display: none; height: 100%; }
      .screen.active { display: block; }
      .cols { display: flex; gap: 22px; height: 100%; }
      /* `overflow-y: auto` is not optional here: .stage clips, and no column scrolled. Settings can
         now list up to 32 remembered cubes, so past a certain number the controls below them were
         simply unreachable — clipped off the bottom with no way to scroll to them. */
      .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
      .aside { flex: 0 1 var(--aside-w); min-width: var(--aside-min); display: flex; flex-direction: column; gap: 16px; }

      /* ---- primitives ----------------------------------------------------- */
      /* Flat on purpose: no fill, no outline. The leading pane is the only raised surface; a card
         is a spacing unit whose contents sit straight on the window paper. That puts eyebrow labels
         on --bg rather than --panel, which is the surface --ink-5 is tuned against (tokens.css). */
      .card { border-radius: var(--r-5); padding: 16px 18px; }
      .card.tight { padding: 0; overflow: hidden; }
      .stat .v { font-family: var(--font-num); font-size: var(--fs-display); font-weight: 600; letter-spacing: -.02em; }
      .stat .d { font-size: var(--fs-body-s); color: var(--ink-4); }
      .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
      /* One rule for the whole document, ahead of every component. Any class that sets `display`
         beats the user-agent [hidden] rule, so each component that needed hiding had grown its own
         [hidden] override — six of them — and the two buttons this branch added were left out.
         Two buttons were therefore visible the whole time, each offering an action before it
         had been earned.
         A seventh per-component rule would have fixed today's instance and left the next one to be
         found the same way, so the six are gone and this stands in their place. */
      [hidden] { display: none !important; }
      .btn { height: 40px; padding: 0 18px; border-radius: var(--r-4); display: inline-flex; align-items: center; gap: 8px; justify-content: center; font-size: var(--fs-body-l); font-weight: 600; }
      .btn.primary { background: var(--invert-bg); color: var(--invert-fg); }
      .btn.accent { background: var(--accent); color: #fff; }
      .btn.outline { border: 1px solid var(--line-strong); color: var(--ink-2); }
      .btn.accent-outline { border: 1px solid var(--accent); color: var(--accent); }
      /* The tabs' own shape and ink, as a button: pill radius, inverted-surface pair — the pair
         exists precisely so this reads right in both themes, where an accent outline did not. */
      .btn.pill { border-radius: var(--r-pill); }
      .btn.sm { height: 32px; padding: 0 12px; font-size: var(--fs-body-s); }
      .btn.block { width: 100%; }
      .pill { border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 15px; font-size: var(--fs-body); font-weight: 600; color: var(--ink-3); }
      .pill.on { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
      .bar { height: 6px; background: var(--panel-sunk); border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .toggle { width: 40px; height: 22px; border-radius: 12px; background: var(--track); position: relative; flex: none; }
      .toggle.on { background: var(--accent); }
      .toggle > i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left var(--fade); }
      .toggle.on > i { left: 20px; }
      svg.ic { width: 1em; height: 1em; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* cube slot */
      .cube-slot { width: 100%; height: 100%; min-height: 220px; display: block; }
      cubus-cube { display: block; width: 100%; height: 100%; }

      /* card header/list */
      .card-h { padding: 14px 18px 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--panel-sunk); }
      /* The solution/scramble card: its header sits directly over the move chips, which carry
         their own borders — a rule between the two reads as clutter, not structure. Cards whose
         header tops a list of borderless rows (Recent solves) keep the divider. */
      .card-h.bare { border-bottom: 0; }
      .card-h b { font-size: var(--fs-body-l); font-weight: 700; }
      /* An eyebrow with a tool on the same line. align-items:center is what makes the icon line up
         with the label; the negative margin keeps a 28px button from inflating an 15px row. */
      .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      /* The state card's heading, styled like the Solution/Scramble card's (.card-h b) rather
         than as an all-caps eyebrow — the two cards sit stacked and should speak in one voice. */
      .state-h { font-size: var(--fs-body-l); font-weight: 700; }
      .eyebrow-row > button { width: 28px; height: 28px; margin: -6px -4px -6px 0; border-radius: var(--r-3); display: grid; place-items: center; color: var(--ink-5); }
      .eyebrow-row > button:hover { background: var(--panel-sunk); color: var(--ink-2); }
      .list { flex: 1; min-height: 0; overflow-y: auto; }
      .row { display: grid; align-items: center; padding: 9px 18px; border-bottom: 1px solid var(--line-faint); font-size: var(--fs-body); }
      .link { color: var(--accent); font-size: var(--fs-body-s); }
      /* The About card: the app's own mark heading a short table of facts. Row icons are the same
         inline set as everywhere else; the key column is fixed so the values align. */
      .about-brand { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-family: var(--font-num); font-size: var(--fs-title-s); }
      .about-brand img { display: block; }
      .about-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: var(--fs-body-s); }
      .about-row .ic { color: var(--ink-5); flex: none; }
      .about-row .k { color: var(--ink-4); width: 62px; flex: none; }
      .about-row a.link { text-decoration: none; }
      .about-row a.link:hover { text-decoration: underline; }

      /* camera scan.
         The pane owns the whole six-face flow. <ai-scan-panel headless autostart> sits inside it
         invisibly, owning only the camera + model, and reports through `scan-progress`; the scan
         is drawn HERE, in the app's own type and colour. The raw camera picture is deliberately
         never shown — what the user needs to see is what the scanner READ, not what the lens saw,
         and the live 3×3 below is exactly that. */
      .scanboard { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-9); text-align: center; }
      /* The scanner speaks through the aside card rather than a status line under the tiles: one
         voice instead of a caption competing with an explanation that says the same thing. */
      .scan-say { color: var(--ink-4); }
      .scan-say.ok { color: var(--ok); }
      .scan-say.err { color: var(--err); }
      /* The transient camera hint ("hold still…", "show the whole face…"), shown UNDER a pinned
         notice rather than in place of it — the pin is the whole point: an explanation must not be
         overwritten by whatever the camera sees 60 ms later. */
      .scan-hint { color: var(--ink-5); font-size: var(--fs-caption); margin-top: 8px; }
      /* The six sides laid out as the cube's net — U above F, D below it, L R B across the middle
         row — so the tiles sit where the faces do. With every tile edged in its neighbours'
         colours, touching tiles now show each other's colour across the join, which is what makes
         the arrangement worth more than a row: the net is self-explaining. */
      /* Row gap far tighter than the column gap on purpose: the label under each tile already adds
         vertical space, and without compensating the three rows read as three rows instead of a
         cross. */
      .scan-faces { width: 80%; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 10px; row-gap: 2px; }
      .scan-face[data-face="U"] { grid-area: 1 / 2; }
      .scan-face[data-face="L"] { grid-area: 2 / 1; }
      .scan-face[data-face="F"] { grid-area: 2 / 2; }
      .scan-face[data-face="R"] { grid-area: 2 / 3; }
      .scan-face[data-face="B"] { grid-area: 2 / 4; }
      .scan-face[data-face="D"] { grid-area: 3 / 2; }
      .scan-face { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      /* The four edges are painted in the NEIGHBOURING faces' colours (set inline — they follow the
         chosen palette), which tells the user which way up to hold that side without a caption.
         Solid, not dashed: four dashed colours are unreadable at this size. Captured vs pending is
         carried by the cells and the label, which is signal enough without spending the border. */
      /* The hairline outside the border is load-bearing, not decoration: four of the six faces have
         WHITE on top, and a white edge on a cream card is invisible without it — which would hide
         the single most common instruction ("hold white up"). The edge colours stay at full
         strength on pending tiles too; those are the sides still to be shown, so they need the
         guidance most. Dimness is carried by the cells alone. */
      /* Rows are declared, not left implicit. Implicit rows are auto-sized, so they were only equal
         while every cell was empty — putting a glyph in the centre gave the middle row a content
         height and stretched that whole row (33/48/33 instead of 38/38/38). A sticker grid must be
         square whatever a cell happens to contain. */
      .scan-face .tile { width: 100%; aspect-ratio: 1; padding: 6px; border-radius: var(--r-5); border: 3px solid var(--line-strong); box-shadow: 0 0 0 1px var(--line); display: grid; }
      /* The 3x3 grid lives on an inner wrapper, NOT on the tile: when a scan settles, a face that
         was captured the wrong way up is animated turning to its true orientation, and rotating
         the tile itself would carry its edge colours along — which are canonical guidance and must
         stay put. The wrapper rotates; the border stays. */
      .scan-face .tgrid { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 3px; transform-origin: 50% 50%; }
      /* A dark hairline and a soft top-down bevel on every sticker. White is the one facelet
         colour that shares a value with the warm-paper tile behind it, so without an edge it has
         no boundary at all and reads as a hole rather than as a sticker. The 2D net
         (.net .sticker) has carried the same hairline since it shipped; this brings the scan grid
         into line with it.
         The bevel is a background-image, NOT an inset box-shadow: the hover ring, the editing ring
         and the centre's own hover ring all set box-shadow, and any of them would wipe an inset
         out. Painting a cell sets style.backgroundColor inline, which overrides only the colour —
         so the gradient survives, and reads against every one of the six. */
      .scan-face .tgrid > i {
        border-radius: 3px; background-color: var(--facelet-off); opacity: .3;
        border: 1px solid rgba(0,0,0,.32);
        background-image: linear-gradient(180deg, rgba(255,255,255,.26), rgba(0,0,0,.10));
      }
      .scan-face .lbl { font-size: var(--fs-caption); font-weight: 700; letter-spacing: .03em; color: var(--ink-5); }
      /* Every sticker but the centre is correctable, on every side. */
      .scan-face .tgrid > i:not(:nth-child(5)) { cursor: pointer; }
      .scan-face .tgrid > i:not(:nth-child(5)):hover { box-shadow: 0 0 0 2px var(--ink); opacity: 1; }
      /* The centre names the face, so it cannot be recoloured; it re-reads the side instead.
         It must show its TRUE colour: it is the one sticker whose colour is certain, and the eight
         around it are read against it. An earlier version laid a 30% black scrim over it to keep
         the glyph legible, which made every centre render as a darkened version of itself and read
         as a seventh colour the cube does not have.
         The glyph carries its own contrast instead — a dark halo under a white mark reads on all
         six colours, and tints none of them. */
      .scan-face .tgrid > i:nth-child(5) { display: grid; place-items: center; }
      .scan-face .tgrid > i:nth-child(5) > .ic {
        opacity: 0; color: #fff; transition: opacity var(--fade);
        filter: drop-shadow(0 0 1px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.55));
      }
      /* Shown, not hidden behind a hover: it is how a user learns the centre re-reads its side, and
         it appears exactly when that is possible — once the side has been read. Hover uses the same
         outline ring the other stickers use, rather than darkening the swatch. */
      .scan-face.done .tgrid > i:nth-child(5) { cursor: pointer; }
      .scan-face.done .tgrid > i:nth-child(5) > .ic { opacity: .92; }
      .scan-face.done .tgrid > i:nth-child(5):hover { box-shadow: 0 0 0 2px var(--ink); }
      .scan-face.done .tgrid > i:nth-child(5):hover > .ic { opacity: 1; }
      /* The scan settling: once the cube reads as solvable its true orientation is known, and any
         face captured the wrong way up TURNS to it — the .tgrid rotates (transition set inline,
         duration matched to the angle, deliberately unhurried), then the repaint lands in the same
         frame the transform resets, so the content never visibly jumps. */
      .scan-face .cell.editing { box-shadow: 0 0 0 2px var(--accent); }
      /* The sticker a colour misread most plausibly landed on — fixing it makes the cube legal.
         Pulses in the error colour so it reads as "look here", distinct from the accent halo an
         asked side wears. Full opacity even on an un-hovered cell: a suspect is being pointed at. */
      .scan-face .tgrid > i.suspect { opacity: 1; box-shadow: 0 0 0 2px var(--err); animation: cubusSuspect 1.1s ease-in-out infinite; }
      @keyframes cubusSuspect { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--err) 40%, transparent); } }

      /* Colour picker for a misread sticker. Fixed to the viewport so it never has to reason about
         an offset parent, and clamped in JS so a sticker at the edge of the net keeps it on screen. */
      .swatches { position: fixed; z-index: 60; display: flex; gap: 6px; padding: 8px; border-radius: var(--r-4); background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow-raise, 0 6px 20px rgba(0,0,0,.18)); }
      .swatches > button { width: 30px; height: 30px; border-radius: var(--r-3); box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); }
      .swatches > button:hover { transform: scale(1.08); }
      .swatches > button.now { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), 0 0 0 2px var(--ink); }
      /* When the picker opens on a suspect sticker, the colour that would make the cube legal is
         ringed in the same error colour the suspect pulses in — the suggestion, not a selection. */
      .swatches > button.suggest { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), 0 0 0 2px var(--err); }
      .scan-face.done .tgrid > i { opacity: 1; }
      .scan-face.done .lbl { color: var(--ok); }
      /* The side the scanner is waiting to be shown again, to settle a reading it cannot settle
         from the six captures alone. Outranks .done: it has been captured, that is the point. */
      /* Keeps its edge colours: the point of asking is that this side be held a particular way up,
         which is exactly what those colours say. The halo carries the attention instead. */
      .scan-face.asked .tile { box-shadow: 0 0 0 1px var(--line), 0 0 0 4px color-mix(in srgb, var(--accent) 32%, transparent); }
      .scan-face.asked .lbl { color: var(--accent); }
      /* Camera control, out of the centred column so it does not shift the scan. The lens fills and
         pulses while a camera is open: with no video on screen, that is the only thing telling a
         user the camera is actually running. */
      /* Tools parked in a card's top-right corner: the scan screen's camera/paint/reset group and
         the cube screen's speed menu. The card must be position:relative. */
      .card-tools { position: absolute; top: 12px; right: 14px; z-index: 2; display: flex; align-items: center; gap: 2px; }
      .card-tools > button { width: 34px; height: 34px; border-radius: var(--r-4); display: grid; place-items: center; color: var(--ink-5); }
      .card-tools > button:hover { background: var(--panel-sunk); color: var(--ink-2); }
      .card-tools > button.open { background: var(--panel-sunk); color: var(--ink); }
      /* Connection indicator, not a control: same box as the tools beside it so the row stays even,
         but no hover and no pointer. */
      /* Connected but no longer verified. Amber rather than green, and still, rather than pulsing —
         a pulse reads as "live and fine", which is the one thing this state is not. */
      .scan-cam.on #scanCamBtn { color: var(--ok); }
      /* Asking whether the cube's own report matches the cube in your hands. Sits directly under the
         2D net, because the net is what you compare against — it shows all six sides at once,
         where the 3D twin shows three and the other half is a guess. */
      /* Painting is a mode, so it reads as held down rather than as a nudge, and the camera dims
         beside it — the two cannot both be true. */
      .scan-cam.paint #scanPaintBtn { background: var(--accent); color: #fff; }
      .scan-cam.paint #scanCamBtn { opacity: .45; }
      .scan-cam.on #scanCamBtn .lens { fill: currentColor; animation: cubusPulse var(--pulse) infinite; }
      /* A menu, not a native <select>: the webcam button is the only control in that corner, and a
         dropdown that has to sit beside it defeats the point. Same popover treatment as the sticker
         colour picker below. */
      .menu { position: fixed; z-index: 60; min-width: 190px; padding: 5px; border-radius: var(--r-4); background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow-raise, 0 6px 20px rgba(0,0,0,.18)); }
      .menu > button { display: block; width: 100%; padding: 7px 10px; border-radius: var(--r-3); text-align: left; font-size: var(--fs-body-s); color: var(--ink-2); white-space: nowrap; }
      .menu > button:hover { background: var(--panel-sunk); color: var(--ink); }
      .menu > button.now { font-weight: 700; color: var(--ink); }
      .menu > button.now::before { content: '✓ '; color: var(--ok); }
      .menu > button.act { color: var(--accent); font-weight: 600; }
      .menu > hr { height: 1px; border: 0; margin: 5px 6px; background: var(--line); }

      /* Transport on the cube screen, all on one line: four buttons (back, repeat, next, play), the
         progress bar, and the step count.
         Speed is not here — it lives in the cube card's corner, because it is a preference you set
         once rather than part of walking the solution. */
      .transport { display: flex; align-items: center; gap: 8px; }
      /* Takes the old spacer's job: it has to be the flexible gap anyway, so the gap may as well
         say how far through the solution you are. --track/--bar are the groove/fill token pair. */
      .transport .progress { flex: 1; height: 6px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
      /* Shown only when the cube has left the plan. A wrong turn and a dropped turn used to look
         identical — both were silence — so this exists to make the difference visible.
         It lives at the FOOT of the solution card, not in the transport row. Toggling it there
         changed that card's height, which resized the cube card above it and made the whole page
         flash on every stray turn. Here it takes its space from #solList, which is `flex:1` and
         scrolls, so appearing costs the move list a few pixels of scroll and moves nothing else.
         The aside is its own column, so the cube never reflows at all. */
      .transport .progress > span { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: var(--bar); transition: width .18s ease; }
      /* Transport controls are glyphs, not boxes. Four outlined squares in a row read as a toolbar
         of equal-weight objects and fight the cube for attention; the icons alone say the same
         thing. Play carries its emphasis in ink weight rather than a filled box.
         Hover gets a soft ground — the same affordance .card-tools uses — so there is feedback
         without a border sitting there permanently. */
      .tbtn { width: 38px; height: 38px; border-radius: var(--r-4); display: grid; place-items: center; color: var(--ink-3); transition: background var(--fade), color var(--fade); }
      .tbtn:hover { background: var(--panel-sunk); color: var(--ink); }
      .tbtn.primary { color: var(--ink); }
      .tbtn[disabled] { opacity: .3; }
      .tbtn[disabled]:hover { background: none; color: var(--ink-3); }
      .pill[disabled] { opacity: .4; cursor: default; }
      .pill[disabled]:hover { background: none; }
      /* Shown only when the last move lands, in the transport row just before the step count — the
         count's own tick. It was a 46px badge over the cube, which said "done" where the count
         already read 22 / 22, and covered the cube to say it. */
      .done-mark { flex: none; width: 22px; height: 22px; border-radius: var(--r-pill); display: inline-grid; place-items: center; color: #fff; background: var(--ok); }

      /* 2D net */
      .net { display: grid; grid-template-columns: repeat(12,1fr); grid-template-rows: repeat(9,1fr); gap: 3px; aspect-ratio: 12/9; max-width: 320px; margin: 0 auto; }
      .net .face { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 2px; }
      .net .sticker { border-radius: 3px; border: 1px solid rgba(0,0,0,.28); transition: background var(--fade); }
      /* The rules that actually paint the net. buildNet sets `class="sticker U"` and applyNetColors
         sets --net-U..B, but nothing joined the two, so every net has rendered as empty outlines
         since it was written — visible now that the cube screen shows one next to the 3D twin. */
      .net .sticker.U { background: var(--net-U); }
      .net .sticker.R { background: var(--net-R); }
      .net .sticker.F { background: var(--net-F); }
      .net .sticker.D { background: var(--net-D); }
      .net .sticker.L { background: var(--net-L); }
      .net .sticker.B { background: var(--net-B); }
      /* A grid of fixed 44px tracks, as many as fit, justified edge-to-edge — so the first column
         sits flush with the heading and the last column flush with the count above, and a column
         can never be clipped: auto-fill computes what fits instead of letting wrap guess. */
      .move-chips { display: grid; grid-template-columns: repeat(auto-fill, 44px); justify-content: space-between; row-gap: 6px; }
      /* One shape for every move: a SQUARE at the 44px minimum tap target (fingers follow these
         mid-solve, often on a touchscreen), text centred both ways at body size — the box grew
         for the finger, not the type. Equal boxes are what let a solution read as a row of steps
         rather than a ragged sentence. */
      .chip-m { font-family: var(--font-num); font-size: var(--fs-body-l); font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink-5); border-radius: 4px; width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
      .chip-m.played { background: var(--panel-sunk); color: var(--ink); }
      .chip-m:hover { border-color: var(--ink-5); color: var(--ink); }
      .chip-m.cur:hover { border-color: var(--invert-bg); color: var(--invert-fg); }
      .chip-m.cur { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }

    </style>
  </head>
  <body>
    <div class="app">
      <div class="win">
        <!-- "deep" makes the whole bar a drag handle, wordmark included; Tauri's drag script
             exempts buttons on its own, which is what keeps the tabs and the window controls
             clickable. app.js fills the two zones per platform (buildChrome) and the tabs
             (renderNav). The screen's name is not drawn here — the filled tab is the name — but
             app.js still sets the window title, which is what the taskbar, the window switcher and
             a browser tab show. -->
        <div class="titlebar" id="titlebar" data-tauri-drag-region="deep">
          <div class="tb-zone" id="tbLead"></div>
          <nav class="tabs" id="nav" aria-label="Screens"></nav>
          <div class="tb-zone tb-trail" id="tbTrail"></div>
        </div>

        <div class="body">
          <!-- main -->
          <div class="main">
            <div class="stage" id="stage"><!-- screens injected here --></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./vendor/cubus-cube.js"></script>
    <!-- AI camera scanner (YOLOv11): registers <ai-scan-panel>, which the Restore screen
         mounts headless + autostart. It owns the camera and onnxruntime-web (model + wasm from
         ./vendor/) and reports through `scan-progress`; the screen draws the scan itself. -->
    <script type="module" src="./vendor/ai-scan-panel.js"></script>
    <script type="module" src="./lib/app.js"></script>
  </body>
</html>
