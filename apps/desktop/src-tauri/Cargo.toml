[package]
name = "cubus-desktop"
version = "0.1.0"
description = "Cubus desktop app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cubus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
log = "0.4"
