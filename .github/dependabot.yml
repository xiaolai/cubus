# Weekly, one grouped PR per ecosystem, so a Monday brings four PRs and not forty.
#
# Every third-party action in .github/workflows is pinned to a full commit SHA with its version in
# a trailing comment; Dependabot moves both together. An npm bump that touches a bundled package
# (three, cubejs, onnxruntime-web, smartcube-web-bluetooth) is not done until the vendored bundles
# are rebuilt and committed — CI's bundle-diff step fails until they are — so those PRs are merged
# read, never on green alone. Cargo majors are left ungrouped on purpose: a Tauri major is a
# migration, not an update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # TWO GROUPS, because a bundled runtime and a test runner are not the same kind of change.
  #
  # `three`, `cubejs`, `onnxruntime-web` and `smartcube-web-bluetooth` are COMPILED INTO the
  # committed bundles and shipped: a bump means rebuilding `apps/web/vendor/`, and it can change what
  # the app looks like or what the scanner reads. Measured 2026-09-26, `three` 0.185.1 to 0.186.1:
  # all 27 renderer appearance goldens move, every one of them DARKER by 1.86-1.91 of 255 on the
  # pixels that shift. Those goldens live in `apps/web/test/browser/`, which is the FULL tier, and a
  # pull request runs the fast tier — so grouped in with eleven dev-tooling bumps that change arrived
  # inside a pull request whose checks read GREEN, and `pnpm check` failed 27 cases on the same tree.
  # Splitting it out adds no gate; it makes the one pull request that has to be read with the goldens
  # in hand distinguishable from the ones that do not.
  #
  # That bump was taken (the shift is upstream's diffuse-BRDF energy-conservation fix, mrdoob/three.js
  # #33985, and the owner accepted the result), which is exactly why the group stays: the NEXT one
  # needs the same look, and nothing else here would ask for it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      bundled-runtimes:
        patterns: ["three", "cubejs", "onnxruntime-web", "smartcube-web-bluetooth"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["three", "cubejs", "onnxruntime-web", "smartcube-web-bluetooth"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # THE /ml PINS ARE A BUILD RECORD, NOT A DEPENDENCY LIST, so they move as ONE unit and rarely.
  #
  # `ml/requirements-cubedet.txt` says it is "pinned to the environment that exported the shipped
  # model" and `ml/requirements-export.txt` says its pins "are the versions MANIFEST.json `tools`
  # records" — and they are: `ml/models/MANIFEST.json` `tools` holds torch 2.13.0, onnx 1.22.0,
  # onnxruntime 1.29.0, coremltools 9.0, tensorflow 2.19.0, onnx2tf 1.28.8, matching pin for pin.
  # Bumping one of them on its own does not update a dependency; it makes the file claim to be the
  # environment that exported the shipped artefacts while naming a version that did not.
  #
  # So a bump here is only ever correct together with a re-export of the model — the whole set at
  # once, verified by `ml/golden_frames.py`, with MANIFEST.json rewritten. Weekly per-package PRs
  # proposed five separately-unmergeable edits to that record every Monday (2026-09-26). One group,
  # monthly: the PR unit is the record, which is also the unit a re-export moves. `pillow` and
  # `numpy` are in it deliberately — they are measurement pins too (icon rasters, and the numpy line
  # the training image ran), not incidental tooling.
  #
  # CVEs do not come through here: Dependabot security updates were enabled on 2026-09-26 and open
  # their own ungrouped PRs, and what SHIPS to a user is gated separately by `pnpm audit --prod`.
  # Nothing in /ml reaches a user's machine — it builds artefacts on a maintainer's.
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: monthly
    groups:
      ml-stack:
        patterns: ["*"]
