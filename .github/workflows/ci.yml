name: CI

# TWO TIERS, decided by the `plan` job (scripts/ci-plan.mjs; apps/web/test/ci-plan.test.mjs pins
# every decision below):
#
#   fast   a pull request: the TypeScript packages' typecheck, lint and tests without coverage,
#          the web app's node-only suites, the vendored-bundle diff, gitleaks — and any platform
#          job whose inputs the pull request touched.
#   full   everything, including the browser suites under xvfb, coverage, the icons, every
#          platform, the golden gate and the supply-chain checks. A push to `main`, the nightly
#          schedule, a manual dispatch, and a pull request labelled `e2e`.
#
# `main` is never thinned: release.yml reads the push-event run for the tagged commit, so that
# run has to be the full tier every time. `labeled` is in the pull-request types so that ADDING
# the label starts the full run rather than waiting for the next push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Read-only tokens for every job: nothing here writes to the repository, so nothing here can be
# made to. Every third-party action is pinned to a full commit SHA (the version is the trailing
# comment; Dependabot moves both), because a tag is a name somebody else can re-point.
permissions:
  contents: read

# One run per ref AND event at a time, and a newer push cancels the run its commit has already
# superseded — the verdict on an outdated commit is not something anyone acts on. The event is in
# the group because the nightly run and a push run both sit on refs/heads/main, and a push
# arriving mid-nightly must not cancel the full-tier verdict the nightly exists to give (or the
# other way round). release.yml keeps its own group with cancel-in-progress off, because a
# release build is not superseded by anything.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHICH TIER, AND WHICH PLATFORMS. A few seconds of node, and every other job reads its
  # outputs: `full` is the tier; `rust`, `ml`, `android`, `icons` and `deps` say whether a pull
  # request touched that job's inputs (always true off a pull request). The inputs are listed in
  # scripts/ci-plan.mjs, next to the reasoning; a change to any workflow or to the plan runs
  # everything, because the plan is then the thing under test.
  plan:
    name: Plan (tier · touched platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      ml: ${{ steps.plan.outputs.ml }}
      android: ${{ steps.plan.outputs.android }}
      icons: ${{ steps.plan.outputs.icons }}
      deps: ${{ steps.plan.outputs.deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # The checkout is the pull request's merge commit at depth 1. Fetching the base commit,
      # also at depth 1, gives git the two trees a diff needs and nothing else — no history, no
      # API call, no third-party action. Off a pull request the list is empty and unread.
      - name: changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          : > changed.txt
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            git diff --name-only "$BASE" HEAD > changed.txt
          fi
          echo "$(wc -l < changed.txt | tr -d ' ') changed files"

      - name: plan
        id: plan
        run: node scripts/ci-plan.mjs < changed.txt

  ts:
    # On the full tier both packages' `check` scripts run `vitest run --coverage` (2026-09-05),
    # and vitest fails the run when the thresholds in their vitest configs are not met — until
    # then the thresholds were configured and run by nothing. The fast tier runs `check:fast`:
    # the same typecheck, lint and tests, without the instrumentation.
    name: TS packages + web app (fast tier on a pull request · full tier on main)
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what SHIPS. `--prod` scopes it to the runtime dependencies —
      # cubejs, onnxruntime-web, aes-js and what they pull in, i.e. what ends up in a bundle a
      # user loads — so a vitest advisory cannot block a release and a three.js one cannot hide
      # behind "dev-only". `high` is the floor; anything below it is Dependabot's to raise as a PR.
      - name: pnpm audit (runtime dependencies)
        run: pnpm audit --prod --audit-level=high

      - name: cube-scanner — check (typecheck · lint · coverage)
        if: needs.plan.outputs.full == 'true'
        run: pnpm --filter cube-scanner run check

      - name: cube-scanner — check:fast (typecheck · lint · test)
        if: needs.plan.outputs.full != 'true'
        run: pnpm --filter cube-scanner run check:fast

      - name: gan-driver — check (typecheck · lint · coverage)
        if: needs.plan.outputs.full == 'true'
        run: pnpm --filter gan-driver run check

      - name: gan-driver — check:fast (typecheck · lint · test)
        if: needs.plan.outputs.full != 'true'
        run: pnpm --filter gan-driver run check:fast

      # The vendored bundles are COMMITTED build artifacts, and the app imports them rather than
      # the sources. They have drifted four times, most recently shipping a driver two safety fixes
      # behind the source every test was reading. The unit guards compare names and message
      # strings, which catches most drift and cannot catch a pure control-flow revert. Rebuilding
      # and diffing catches all of it, and costs a few seconds.
      - name: vendored bundles are built from the current sources
        run: |
          pnpm build:panel
          pnpm --filter cube-scanner build:misread-worker
          pnpm --filter cube-scanner build:letterbox-worker
          pnpm --filter cube-scanner build:inference-worker
          pnpm --filter cubus-web build:mcp-guest
          pnpm --filter cubus-web build:cube
          pnpm --filter cubus-web build:cubejs
          pnpm --filter cubus-web build:smartcube
          git diff --exit-code -- apps/web/vendor/ \
            || { echo "::error::a vendored bundle is behind its source — rebuild and commit it"; exit 1; }

      # The photo drop's proposal tool (ml/propose.py) runs THIS package's assembly, bundled from
      # these sources, so its tests run here: where node_modules exist, on every pull request. The
      # golden job has no Node, and a scanner-only change skips it. Under CI the Node cases fail
      # rather than skip when node or esbuild is missing.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: ml/propose.py — the proposal tool against the scanner's current assembly
        run: |
          # The golden harness's pins (ml/requirements-golden.txt). No model is loaded, so no onnxruntime.
          pip install --quiet numpy==2.3.5 pillow==12.3.0
          python ml/test_propose.py
          python ml/test_drop_dataset.py
          python ml/test_drop_eval.py

      # THE FAST TIER'S WEB TESTS: every suite under apps/web/test/ except test/browser/, run by
      # apps/web/run-tests.mjs, which refuses a pattern that matches nothing and a test file that
      # belongs to no tier — so this cannot become a green step that ran nothing.
      - name: cubus-web — test:fast (the node-only suites)
        if: needs.plan.outputs.full != 'true'
        run: pnpm --filter cubus-web test:fast

      # TWO ENGINES, because two suites need different things from a browser.
      #
      # WebKit for the geometry test (apps/web/test/browser/geometry.test.mjs): it measures the
      # layout contract in the engine every shipped build actually is, because the CSS is the
      # runtime and no text test can tell whether a container unit resolved.
      #
      # Chromium for the scanner test (apps/web/test/browser/scanner-gpu.test.mjs): WebKit has no
      # WebGPU to test at all. That suite was written and merged without ever running here, and its
      # first CI run failed on a missing executable — a test that cannot start is not a test that
      # passed.
      #
      # Playwright is an exact-pinned dev dep of apps/web; this fetches the matching builds. Missing
      # either fails the tests, loudly.
      # `--with-deps` below, and the icons step further down, both shell out to apt. This leaves
      # apt reading the Ubuntu archive alone, so an index mismatch on a third-party source nothing
      # here installs from cannot decide whether this job runs. Conditioned on the same tiers as
      # the two steps that need it: a fast-tier run touches apt at all, and must not gain a way
      # to fail that it did not have.
      - uses: ./.github/actions/apt-ubuntu-only
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.icons == 'true'

      - name: cubus-web — browser engines for the geometry and scanner suites
        if: needs.plan.outputs.full == 'true'
        run: pnpm --filter cubus-web exec playwright install --with-deps webkit chromium

      # UNDER XVFB, because the scanner suite launches Chromium HEADED and a runner has no display.
      # Headed is not a preference there: headless Chromium substitutes a software GPU that is
      # ~500x slower than a real one (measured, 7320 ms a frame against 15), so a headless run would
      # not test the GPU path, it would libel it.
      #
      # This does NOT give the runner a GPU. `requestAdapter()` still returns null here, and the
      # suite reports that and asserts the wasm floor instead — which is the half CI can honestly
      # gate. `--enable-unsafe-swiftshader` is deliberately not passed anywhere, so a software
      # adapter can never masquerade as hardware and turn this into a green that means nothing.
      - name: cubus-web — test (every suite, the node-only ones and the browser ones)
        if: needs.plan.outputs.full == 'true'
        run: xvfb-run -a pnpm --filter cubus-web test

      # The icons had no gate at all, which is why the iOS and Android projects carried Tauri's
      # placeholder mark from the day the mobile shells landed until someone looked at a phone.
      # Every check that needs an Apple-only tool (sips, assetutil, ictool) reports as skipped
      # here rather than failing the job; what still GATES on Linux is the whole mobile set —
      # every rung the iOS catalogue declares, at its declared size, with no alpha channel, and
      # the Android layers plus the anydpi wiring that makes them reachable at all.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.icons == 'true'
        with:
          python-version: "3.11"
      - name: icons — the shipped rasters are the ones the sources produce
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.icons == 'true'
        run: |
          # librsvg, not just Pillow: the .ico round-trip decodes every member back and
          # compares it against a fresh render of the same source, which needs a renderer.
          # Without it the verifier raised before reporting a single gated check — and the
          # skip path is only a floor, not a substitute for actually running the check.
          sudo apt-get install -y -qq librsvg2-bin
          # The Pillow the golden harness pins (ml/requirements-golden.txt). Unpinned, the icon
          # measurements could move on a Pillow release while the golden job stayed put, and
          # nothing would say which of the two had actually changed.
          pip install --quiet pillow==12.3.0
          python scripts/verify-icons.py

  # THE COMPLETENESS PROOF THE METHOD SOLVER RESTS ON — its OWN job, sharded by rung combination.
  #
  # `bench/method-solver-profile.mjs exhaustive` enumerates all 62,208 reachable last-layer states
  # and checks the repertoire finishes every one. Until 2026-09-09 that claim lived only in a
  # benchmark nobody ran — so a repertoire change could pass every sampled test while leaving a
  # learner's cube unfinishable six months later, which is the exact failure the sweep exists to
  # rule out. Since then it runs at EVERY last-layer rung combination, because the one-look rungs
  # are a 57-case and a 21-case table and "the table is complete" is precisely the claim a sample
  # cannot make.
  #
  # **It was a step inside `ts`, and it could not fit there.** Four combinations measured at ~50
  # minutes in total, in a job whose timeout is 45 — shared with install, two package checks, the
  # vendored-bundle rebuild, two browser downloads and the browser suites. A full-tier run was one
  # slow runner away from being cancelled mid-sweep, and a cancelled job is a job that says nothing
  # about the thing it was proving. Nothing had failed yet, which is the only reason it had not
  # been noticed.
  #
  # Sharded rather than merely moved: each combination is its own runner, so the wall time is one
  # sweep and not four, and a failure names the rung combination it happened at.
  #
  # **The timeout is sized from a measurement, which is the half the old arrangement got wrong.**
  # Measured 2026-09-10 on an M-series laptop: the two-look combination (0,0) is the slowest at
  # ~950 s and the one-look one (1,1) the fastest at ~490 s, so all four together are ~47 minutes —
  # which is where the "~50 minutes" in the old comment came from, and why it never fitted in a
  # 45-minute job it shared with everything else. 45 minutes PER SHARD is roughly 2.8x the slowest
  # measured combination, which is the headroom a runner slower than a laptop needs. It is a
  # LIVENESS bound — "something is wedged" — and not a performance assertion; a proof that is
  # merely running must never be cancelled, because a cancelled job says nothing about the thing
  # it was proving.
  #
  # A first draft of this job said 25 minutes, on the reasoning that it was "roughly double the
  # per-combination cost" — reasoning, not measurement, and the measurement then said 16 minutes
  # for the slowest shard on the fastest machine available. That is the same mistake one rung
  # down.
  #
  # **2.8x was not enough, and the answer was not a bigger number (2026-09-17).** On the runners,
  # the (oll 0, pll 1) shard measured 23, 24, 43 and 44 minutes over four runs of identical work —
  # two runner speeds, one twice the other — and was cancelled at 45 on the fifth. The sweep was
  # 62,208 independent solves on ONE core of a four-core runner, so it now spreads them across every
  # core (worker threads, one slice per core, the slices checked to be the whole enumeration before
  # anything is reported — `checkCoverage` in the bench). The bound stays where it is: it is a
  # liveness bound, and the work it bounds is what changed.
  last-layer-sweep:
    name: method solver — the 62,208-state completeness sweep (nightly)
    needs: [plan]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        oll: [0, 1]
        pll: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: sweep every last-layer state at oll ${{ matrix.oll }} · pll ${{ matrix.pll }}
        working-directory: apps/web
        run: node bench/method-solver-profile.mjs exhaustive ${{ matrix.oll }} ${{ matrix.pll }}

  # THE PLATFORM BRANCHES THE LINUX JOB CANNOT SEE.
  #
  # `cargo check` on ubuntu compiles cube-vision's INERT branch — the one that registers no
  # commands. So `windows.rs` and the Android `android_ble.rs` could break, drift, or (as happened)
  # be dead on arrival, and every gate stayed green: a cfg'd-out module is not compiled, and code
  # that is not compiled cannot fail. Windows' native path was in fact unreachable in every build
  # for as long as it existed, because nothing bundled its model, and nothing here would have said
  # so.
  #
  # Compile-only, deliberately. These runners have no camera, no cube and no GPU, so they cannot
  # tell whether the paths WORK — only that they still build and that their command surfaces still
  # typecheck against the seam. That is the honest limit of what CI can assert here, and it is
  # strictly more than zero.
  # THE PLATFORM BRANCHES THE LINUX JOB CANNOT SEE.
  #
  # `cargo check` on ubuntu compiles cube-vision's INERT branch — the one that registers no
  # commands. So `windows.rs` and the Android `android_ble.rs` could break, drift, or (as happened)
  # be dead on arrival, and every gate stayed green: a cfg'd-out module is not compiled, and code
  # that is not compiled cannot fail. Windows' native path was in fact unreachable in every build
  # for as long as it existed, because nothing bundled its model, and nothing here would have said
  # so.
  #
  # Compile-only, deliberately. These runners have no camera, no cube and no GPU, so they cannot
  # tell whether the paths WORK — only that they still build and that their command surfaces still
  # typecheck against the seam. That is the honest limit of what CI can assert here, and it is
  # strictly more than zero.
  rust-platforms:
    name: Rust (windows · android compile)
    needs: [plan]
    if: needs.plan.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: ubuntu-latest
            target: aarch64-linux-android
            label: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.label }}

      # Android needs the NDK's linker on PATH for `cargo check` to resolve its target.
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        if: matrix.label == 'android'
        id: ndk
        with:
          ndk-version: r27c

      - name: check
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo check -p cube-vision -p cubus-desktop --target ${{ matrix.target }}

      - name: clippy
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo clippy -p cube-vision --target ${{ matrix.target }} -- -D warnings

      # Windows can also RUN its unit tests; the Android target cannot execute on the runner.
      - name: test
        if: matrix.label == 'windows'
        run: cargo test -p cube-vision -p cubus-desktop --lib --target ${{ matrix.target }}

  # THE APPLE BRANCHES, which the Linux job compiles as inert stubs and the job above never sees:
  # cube-vision's Swift half (built by swift-rs), apple.rs, the objc2 traffic-light code in lib.rs.
  # Until 2026-09-05 the first thing that compiled any of it was a tagged release build, so a
  # clippy warning in apple.rs was a red RELEASE rather than a red push. Same standard as Linux —
  # -D warnings across every target, and the unit tests that can run on a runner with no camera.
  rust-macos:
    name: Rust (macOS · iOS compile)
    needs: [plan]
    if: needs.plan.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos

      - name: clippy
        run: cargo clippy -p cube-vision -p cubus-desktop --all-targets -- -D warnings

      - name: test
        run: cargo test -p cube-vision -p cubus-desktop --lib

      # And the phone. aarch64-apple-ios was compiled NOWHERE — release.yml's iOS Build step was
      # skipped for want of a certificate — so the iOS build script's first run would have been a
      # tag. A check is what a runner without a device can honestly do, and it is what fails when
      # a crate in the tree drops the target.
      - name: check (aarch64-apple-ios)
        run: cargo check -p cube-vision -p cubus-desktop --target aarch64-apple-ios

  rust:
    name: Rust (fmt · clippy · check · tests)
    needs: [plan]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tauri's Linux backend (webkit2gtk / appindicator / rsvg), plus dbus for btleplug — the
      # BLE bridge is back (2026-08-27, recovered from v0 for the smart-cube return).
      - uses: ./.github/actions/apt-ubuntu-only

      - name: Install Linux system deps
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config \
            libpipewire-0.3-dev libclang-dev

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      # On Linux, cube-vision compiles to its inert stub (no Swift), which is exactly what a Windows/
      # Linux build ships — the app runs WebDetector there. The macOS golden job below is what
      # exercises the real native plugin.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: check
        run: cargo check --workspace

      # The dev-only MCP harness is a cargo FEATURE (`pnpm dev` builds with it, `tauri build` never
      # does), so the workspace check above compiles the desktop shell WITHOUT it, and the
      # feature-gated code in lib.rs could rot behind every gate while every dev machine still
      # built it. Compiled here; still never shipped.
      - name: desktop — the `mcp` feature still compiles
        run: cargo check -p cubus-desktop --features mcp

      # The desktop window's arithmetic (src/stage.rs) is held to the contract document's table,
      # the same rows the web oracle is held to.
      - name: desktop — stage arithmetic
        run: cargo test -p cubus-desktop --lib

      # The BLE bridge's own tests — the no-brand-constants rule in crates/cube-ble/tests and the
      # bridge's unit tests. clippy above COMPILES that test binary (--all-targets); nothing RAN
      # it until 2026-09-05, so a failing assertion in there was invisible to every gate.
      - name: cube-ble — tests
        run: cargo test -p cube-ble

      # The optimal solver's §7 verification bar (histograms, Bellman over all 173M entries,
      # superflip triple, metric contract, ball shells to depth 6, geodesic fixtures to L=13,
      # the generator's determinism across core counts, cancellation, artifact corruption).
      # Release profile because table generation is BFS over 88M entries — debug would turn
      # ~90 s into many minutes.
      #
      # The geodesic L=10..=13 tier moved in here on 2026-09-09 (return plan B4). It had been
      # behind `--ignored` with the label "minutes"; measured, the whole tier is 10.6 s, so it
      # was costing nothing to run and was not being run — which left the prover verified up to
      # depth 9 while the case tables it will produce live at 7..=15.
      - name: optimal solver plan checks (release)
        run: cargo test -p optimal-solver --release

      # THE DEPTH PLL ACTUALLY REACHES, nightly and on main. The per-state PLL maximum is 15 face
      # turns and the geodesic fixtures used to stop at 13, so the prover was verified in a range
      # that nearly covered the case tables and stopped just short. Measured 2026-09-09: seven
      # L=14 segments and six L=15 segments, 2 min 18 s in total. Named explicitly, so a new
      # ignored test cannot silently join a step whose cost was measured for these two.
      - name: optimal solver — the L=14..15 geodesic tier (nightly)
        if: needs.plan.outputs.full == 'true'
        run: cargo test -p optimal-solver --release --test plan_checks -- --ignored --exact geodesic_segments_prove_their_exact_depth_pll_tier

      # THE REFUTATION PASS BEHIND THE F2L TABLE, nightly and on main. Every one of the 42 cases
      # re-solved from scratch by brute force — no heuristic, no pattern database, nothing pruning
      # but the canonical move order — and compared with the table's claim on both counts: that
      # nothing shorter reaches the goal, and that the minimal SET is complete. It is the only
      # check of that table which does not rest on the projection's own pruning, and a pattern
      # database is exactly the thing whose failure is silent: an inadmissible entry does not
      # crash, it returns a length that is not the minimum, and every check built on the same
      # tables agrees with it. Measured 2026-09-09: about two minutes, nearly all of it the three
      # nine-move cases.
      - name: optimal solver — the F2L brute-force refutation (nightly)
        if: needs.plan.outputs.full == 'true'
        run: cargo run --release -p optimal-solver --bin f2l-cross-check

      # The memory-hungry rung, likewise nightly: the depth-7 HTM ball shell needs about 4.78 GiB
      # (§7a finding F7 — an earlier 1.9 GiB estimate omitted the frontier vectors). A runner
      # without that memory does not fail this test, it is killed, and a job that vanishes reads
      # as a job that never mattered.
      - name: optimal solver — the depth-7 ball shell (nightly)
        if: needs.plan.outputs.full == 'true'
        run: cargo test -p optimal-solver --release --test plan_checks -- --ignored --exact htm_ball_shell_at_depth_7_is_exact

  # THE ANDROID SHELL'S KOTLIN, on every push. Its unit tests cover the pure halves of the two
  # plugins (`letterboxFrom`, `uuid`, `hex`, `matches`) — the part that had no verification at all
  # before 2026-08-31, and where the defects were: a twelve-digit UUID group, an empty filter
  # matching every advertiser, a letterbox computed in Float where the TypeScript uses double.
  # Until 2026-09-05 they ran only in release.yml, i.e. only on a tag.
  android-shell:
    name: Android shell (Kotlin unit tests)
    needs: [plan]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 21, not the runner default. Gradle 8.14.3 + AGP 8.11.0 run on 17-21, and a newer JDK dies
      # with "Unsupported class file major version NN", which names neither Java nor the fix.
      # scripts/tauri-android.mjs enforces the same range locally; this is the CI half of it.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # `packages` named explicitly: the action's default is `tools platform-tools`, and the SDK
      # repository no longer carries `tools` — sdkmanager answers "Failed to find package 'tools'"
      # and exits 1, which failed this step on 2026-09-15 before any of our code ran. sdkmanager
      # itself comes from cmdline-tools, which the action installs regardless.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-shell

      # THE TWO GRADLE FILES THE RUST BUILD OWNS. `gen/android/settings.gradle` applies
      # `tauri.settings.gradle` unconditionally and `app/build.gradle.kts` applies
      # `tauri.build.gradle.kts`; both are gitignored and written by tauri-build — the desktop
      # crate's build script — when TAURI_ANDROID_PROJECT_PATH names the project (they carry
      # absolute paths into the cargo registry, which is why they cannot be committed). `tauri
      # android init` does NOT write them: its template has neither (tauri-cli 2.11.4), and
      # `tauri android build` only gets them because its cargo build runs the script. The cheapest
      # thing that does the same is a `cargo check` for the Android target — it runs the build
      # script and links nothing, and the NDK is needed for that check alone. The files are then
      # ASSERTED, because a Gradle run that cannot configure fails in a way that names none of this.
      - name: generate tauri.settings.gradle and tauri.build.gradle.kts
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android
          # What `tauri android build` exports before its cargo build, and what tauri's and wry's
          # build scripts demand once TAURI_ANDROID_PROJECT_PATH turns the Android codegen on:
          # the package the Kotlin files belong to, the Rust library they load, and the directory
          # the generated Kotlin is written to (which must already exist — wry canonicalises it).
          # The first run of this job on a real runner panicked on exactly the first of these
          # (2026-09-05), which a `cargo check` without the project path never asks for.
          WRY_ANDROID_PACKAGE: im.cubus.app
          WRY_ANDROID_LIBRARY: cubus_desktop_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android/app/src/main/java/im/cubus/app/generated
        run: |
          set -eu
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          cargo check -p cubus-desktop --target aarch64-linux-android
          for f in tauri.settings.gradle app/tauri.build.gradle.kts; do
            test -f "apps/desktop/src-tauri/gen/android/$f" \
              || { echo "::error::the Rust build did not write gen/android/$f — Gradle cannot configure the project without it"; exit 1; }
          done

      # No device and no Rust library: buildSrc's RustPlugin hooks the cargo build onto the
      # merge*JniLibFolders tasks, which the unit-test task graph never reaches. What the graph
      # does reach is :app:copyCubeModel, so ml/models/cubedet.tflite has to exist here — it is
      # tracked, and that task fails rather than skips if it ever is not.
      - name: Kotlin unit tests
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew testArm64DebugUnitTest

      # The third-party notices list the release classpath from app/gradle.lockfile, and
      # app/build.gradle.kts locks every release build to it, so what ships is what the lockfile
      # says. What that cannot catch is a dependency change nobody relocked — the lockfile would go
      # on forcing the old versions, and fail only when a module it has never seen arrives. So the
      # lockfile must be what Gradle resolves now: relock, and refuse a difference, the vendored
      # bundles' drift check in Gradle's terms. (The `dependencies` report is not a gate on its own:
      # it prints FAILED for a module the lock does not list and exits 0 — measured 2026-09-14.)
      - name: The Android lockfile is what Gradle resolves
        working-directory: apps/desktop/src-tauri/gen/android
        run: |
          ./gradlew :app:dependencies --write-locks > /dev/null
          if [ -n "$(git status --porcelain -- app/gradle.lockfile)" ]; then
            git diff -- app/gradle.lockfile
            echo "::error::gen/android/app/gradle.lockfile is not what Gradle resolves: relock, run node scripts/android-licences.mjs and pnpm notices, and commit all three"
            exit 1
          fi

  # The golden-frame parity gate (dev-docs/native-capture-and-inference-plan.md, Phase 4). Every
  # runtime must read the 20 committed fixtures exactly as ml/golden/expected.json pins it, or a
  # model/runtime has drifted from the one checkpoint. Split by platform: the runtimes that run on
  # Linux here, CoreML + the native plugin path on macOS below.
  golden-linux:
    name: Golden frames (onnx · tflite · int8 when exported)
    needs: [plan]
    if: needs.plan.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the golden-harness runtimes
        run: pip install -r ml/requirements-golden.txt
      # The pipeline's pure pieces — the cube geometry, the one-pigment-per-colour rule, the
      # COCO→detector conversion. Off-GPU by design and, until 2026-09-05, off-CI by accident: a test
      # file with a docstring saying how to run it, run by nobody.
      - name: The pipeline's pure pieces
        run: python ml/test_pipeline.py
      # Needs no model, no runtime and no hardware — it exercises the faithfulness rule itself,
      # which was inverted when first written and passed every real leg anyway.
      - name: The faithfulness rule is directional
        run: python ml/golden_frames.py --self-check
      # NO --legs. The Linux legs are onnx, tflite and the int8 ONNX -- but only when the export
      # wrote an int8, which it refuses to do for a graph that quantisation destroys (MANIFEST.json
      # records `produced: false` and why). Naming the leg here forced the attempt anyway, and the
      # job failed on a file that is absent on purpose. The default set follows the manifest, and
      # the harness fails if expected.json still pins reads for a leg the manifest has retired.
      - name: host-internal parity on every leg this host can run (see golden_frames.py, PARITY mode)
        run: python ml/golden_frames.py --parity
      # THE TFLITE LEG, CONVERTED FOR REAL. test_pipeline.py drives that path with the converter stood
      # in for, which cannot see onnx2tf itself changing under us — a differently named output, a graph
      # the runtime will not load, or the in-place rewrite of the fp32 that the 2026-09-04 repair was
      # about. The export stack is a ~600 MB install, so the conversion runs where the full tier runs
      # (main, the nightly, a dispatch); on a pull request the check SKIPS, out loud, and never as a
      # pass (audit, 2026-09-19).
      - name: Install the export stack (full tier only)
        if: github.event_name != 'pull_request'
        run: pip install -r ml/requirements-export.txt
      - name: ml/test_export_tflite.py — the committed fp32 converts, and the graph loads
        run: python ml/test_export_tflite.py
      # And the metrics table's adapter, end to end: the shipped model scored against its own reads of
      # a golden frame, which only comes back near-perfect when every box and class survives the trip
      # between the adapter and the evaluator. Needs torch, which the export stack brings and the
      # golden harness alone does not — so it runs on the full tier and SKIPS, out loud, on a pull
      # request (audit, 2026-09-19).
      - name: ml/test_evaluator.py — the adapter and the evaluator agree about a box
        run: python ml/test_evaluator.py

  # THE TRAINER'S OWN TESTS, which ran nowhere. ml/test_cubedet.py covers the code that produced the
  # shipped detector -- the assigner, the loss, the backbone contract, the export graph, the scoring
  # both evaluators share, and the refusals that stop a run from training on the wrong thing -- and
  # until 2026-09-17 no job invoked it: a docstring said how to run it, and nobody did.
  #
  # CPU wheels (the extra index), because the PyPI build of torch on Linux carries CUDA and nothing
  # here has a GPU. And A SKIP IS A FAILURE: several tests `importorskip` onnx, onnxruntime or timm,
  # so an environment missing one would report green over tests that never ran.
  #
  # THE ONE TEST THAT CANNOT RUN HERE IS DESELECTED, NOT SKIPPED, and the distinction is the whole
  # point of the rule above. `test_evaluate_runs_on_an_accelerator` needs CUDA or MPS by design — it
  # exists to catch a `torch.zeros(...)` with no `device=`, which a CPU-only run structurally cannot
  # see, because there is only one device for tensors to be on. On this runner it skipped, and "a
  # skip is a failure" then made the job unpassable: it went red on its first run, on the commit that
  # landed it. Deselecting names the exclusion in the command where a reader sees it, and leaves the
  # skip rule doing its real job — catching a missing dependency. It is also self-correcting: rename
  # the test and the deselect stops matching, the test is collected, it skips, and this goes red
  # again. It runs on the training box and on the maintainer's Mac, which is where a device
  # mismatch can actually be observed.
  cubedet:
    name: cubedet (trainer · scoring · export contract, CPU)
    needs: [plan]
    if: needs.plan.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the cubedet stack (ml/requirements-cubedet.txt, CPU wheels)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ml/requirements-cubedet.txt
      - name: ml/test_cubedet.py, where a skipped test fails the job
        run: |
          python -m pytest ml/test_cubedet.py -q -rs -p no:cacheprovider --junitxml=cubedet-junit.xml \
            --deselect ml/test_cubedet.py::test_evaluate_runs_on_an_accelerator
          python -c "import sys, xml.etree.ElementTree as E; r = E.parse('cubedet-junit.xml').getroot(); s = r if r.tag == 'testsuite' else r.find('testsuite'); n, k = int(s.get('tests')), int(s.get('skipped')); print(f'{n} tests, {k} skipped'); sys.exit(1 if n == 0 or k else 0)"

  golden-macos:
    name: Golden frames (coreml · native plugin)
    needs: [plan]
    if: needs.plan.outputs.ml == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the golden-harness runtimes
        run: pip install -r ml/requirements-golden.txt
      # The native leg drives the plugin's OWN letterbox + CoreML through cube-vision-probe, so build
      # it — this is what proves the shipped native code, not a Python stand-in, still reads identically.
      - name: Build the cube-vision probe
        run: swift build -c release --package-path crates/cube-vision/swift
      # The native scanner's per-tick entry end to end on an injected frame — the size of the picture the
      # page places each sticker in, on every path, no model and no camera included — and the camera
      # position behind the facing that decides whether the sticker view is mirrored. The support the
      # tests reach (an injected frame, a stand-in model, a state reset) is `internal`, so it carries no
      # C symbol and no Rust or page caller can reach it; it is compiled into every configuration, which
      # is why the release one is run too (2026-09-19).
      - name: The cube-vision Swift tests
        run: swift test --package-path crates/cube-vision/swift
      # And in the configuration the app actually links: optimisation is where a wrong assumption about
      # lifetimes or exclusivity shows up, and the debug run cannot see it (audit, 2026-09-19). Its own
      # scratch path, so it cannot rebuild the release probe the steps below measure.
      - name: The cube-vision Swift tests, release
        run: swift test -c release --scratch-path crates/cube-vision/swift/.build-release-tests --package-path crates/cube-vision/swift
      # The fp16 widening in Model.swift is hand-written, because Swift's Float16 is arm64-only and
      # the macOS release target is a universal binary. Exhaustive over all 65,536 half patterns, so
      # it is a proof and not a sample — it caught 1022 wrong ones (signalling NaNs) on its first run.
      - name: The fp16 widening matches Float16, exhaustively
        run: crates/cube-vision/swift/.build/release/cube-vision-probe --self-check
      # The FFI entries are called from Rust threads that never pop an autorelease pool, and CoreML
      # autoreleases per prediction: without a pool of their own they leaked 3.6 MB per inference,
      # 58 MB/s at the scan panel's tick rate, and a user's Mac reported the app at 94 GB
      # (2026-09-06). The probe drives the real entry from a pool-less thread and fails above
      # 100 KB per call; the real leak was thirty-six times that.
      - name: The FFI path leaves nothing behind on a pool-less thread
        run: crates/cube-vision/swift/.build/release/cube-vision-probe --leak-check ml/models/cubedet.mlpackage 300
      - name: coreml · native — exact class parity with THIS host's fp32, plus the pinned model bytes
        run: python ml/golden_frames.py --parity --legs onnx coreml native
      # The same check with CoreML pinned to the CPU, which discriminates between the two candidate
      # causes of the fp16 divergence this runner shows and no local Mac does. `--compute-units all`
      # lets CoreML choose ANE, GPU or CPU by what the machine has; `cpu_only` removes that choice.
      # It survived: measured 2026-09-01, cpu_only refuses photo-01 exactly as `all` does, on both
      # legs. So the cause is the silicon's fp16 arithmetic and not dispatch, and no compute-unit
      # setting removes it. The step stays as a REGRESSION guard rather than a question: if a future
      # runner ever diverges under one setting and not the other, that is new information.
      #
      # A gate, not a probe: the faithful legs must never MISREAD under either dispatch. A refusal
      # is tolerated by the rule in golden_frames.py either way, so this cannot go red merely for
      # reproducing what we already know.
      - name: coreml · native — parity holds with dispatch removed (cpu_only)
        run: python ml/golden_frames.py --parity --legs onnx coreml native --compute-units cpu_only

  # WHAT THE TREE PULLS IN, and what the scripts say. Neither ran anywhere until 2026-09-05.
  supply-chain:
    name: Supply chain (cargo audit · shellcheck)
    needs: [plan]
    if: needs.plan.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable

      # Caches ~/.cargo/bin too, so the install below is paid once per lockfile change.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: supply-chain

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      # A GATE FOR NEW ADVISORIES, not a report nobody reads. `cargo audit` alone exits 0 on
      # warnings, and this tree carries nineteen of them from upstreams this project cannot fix —
      # so the known ones are listed by ID, each with its reason, and anything NOT on the list
      # fails the job: a fresh vulnerability, a crate newly marked unmaintained or unsound.
      # Reviewed 2026-09-05; delete an entry when its upstream fix lands, so the gate notices a
      # regression rather than silently forgiving it.
      #
      #   RUSTSEC-2024-0411 … 0420  gtk-rs GTK3 bindings, unmaintained. Tauri's Linux backend is
      #                             webkit2gtk on GTK3; leaving it is Tauri's migration, not ours.
      #   RUSTSEC-2024-0429         glib 0.18 `VariantStrIter` unsoundness — same tree, same owner.
      #   RUSTSEC-2024-0436, -0370  paste, proc-macro-error: proc-macro helpers reached only
      #                             through tauri's and its plugins' trees; nothing here calls them.
      #   RUSTSEC-2025-0075/0080/0081/0098/0100  unic-*: via tauri-utils' identifier validation.
      #
      # `yanked` is NOT denied: the one yanked crate in the tree (chacha20 0.10.1, via
      # tauri-plugin-mcp → xcap → rand) has no advisory ID to allow-list, and it sits behind the
      # dev-only `mcp` feature that no release binary compiles. It still prints.
      - name: cargo audit
        run: |
          cargo audit --deny unmaintained --deny unsound \
            --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100

      # Every shell script git tracks, found by git rather than listed by hand. The gate that would
      # have caught `security list-keychain -s` replacing a keychain search list and an unquoted
      # `build-tools/*/apksigner` glob, had it existed when those were written. It named only
      # scripts/ and .githooks/, so a training script under ml/ (since removed) -- which ran `detector export` on the host from a
      # comment inside a double-quoted container script -- was never checked at all. The plan's
      # `*.sh` input is what brings this job to a pull request that touches any of them.
      - name: shellcheck
        run: git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 shellcheck

      # The licence notices are generated from the lockfiles and the packages themselves
      # (scripts/make-third-party-notices.mjs) and committed, like the vendored bundles — and like
      # them they drift the moment a dependency moves and nobody re-runs the generator. This is
      # the only job with both cargo and node, so it is where the committed file is compared to
      # what the tree would generate now; `pnpm notices` is the fix.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: THIRD_PARTY_NOTICES.md matches the lockfiles
        run: pnpm notices --check

  # Committed credentials. The 2026-09-04 read-through found none; this is what keeps that true
  # without a read-through. `.gitleaksignore` at the root carries the known false positives —
  # the GAN protocol's published AES key in gan-driver's protocol notes, a constant of the wire
  # format that every implementation contains, not a secret of ours.
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The action scans the commits of the push (or the PR), and needs their parents to do it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments would need `pull-requests: write`; the job fails visibly without them.
          GITLEAKS_ENABLE_COMMENTS: "false"
