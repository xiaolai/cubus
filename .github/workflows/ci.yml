name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only tokens for every job: nothing here writes to the repository, so nothing here can be
# made to. Every third-party action is pinned to a full commit SHA (the version is the trailing
# comment; Dependabot moves both), because a tag is a name somebody else can re-point.
permissions:
  contents: read

# One run per ref at a time, and a newer push cancels the run its commit has already superseded —
# the verdict on an outdated commit is not something anyone acts on. release.yml keeps its own
# group with cancel-in-progress off, because a release build is not superseded by anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    # "coverage" is in the title because it is enforced: both packages' `check` scripts run
    # `vitest run --coverage` (2026-09-05), and vitest fails the run when the thresholds in their
    # vitest configs are not met. Until then the thresholds were configured and run by nothing.
    name: TS packages (typecheck · lint · test · coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what SHIPS. `--prod` scopes it to the runtime dependencies —
      # cubejs, onnxruntime-web, aes-js and what they pull in, i.e. what ends up in a bundle a
      # user loads — so a vitest advisory cannot block a release and a three.js one cannot hide
      # behind "dev-only". `high` is the floor; anything below it is Dependabot's to raise as a PR.
      - name: pnpm audit (runtime dependencies)
        run: pnpm audit --prod --audit-level=high

      - name: cube-scanner — check
        run: pnpm --filter cube-scanner run check

      - name: gan-driver — check
        run: pnpm --filter gan-driver run check

      # The vendored bundles are COMMITTED build artifacts, and the app imports them rather than
      # the sources. They have drifted four times, most recently shipping a driver two safety fixes
      # behind the source every test was reading. The unit guards compare names and message
      # strings, which catches most drift and cannot catch a pure control-flow revert. Rebuilding
      # and diffing catches all of it, and costs a few seconds.
      - name: vendored bundles are built from the current sources
        run: |
          pnpm build:panel
          pnpm --filter cube-scanner build:misread-worker
          pnpm --filter cubus-web build:mcp-guest
          pnpm --filter cubus-web build:cube
          pnpm --filter cubus-web build:cubejs
          pnpm --filter cubus-web build:smartcube
          git diff --exit-code -- apps/web/vendor/ \
            || { echo "::error::a vendored bundle is behind its source — rebuild and commit it"; exit 1; }

      # TWO ENGINES, because two suites need different things from a browser.
      #
      # WebKit for the geometry test (apps/web/test/geometry.test.mjs): it measures the layout
      # contract in the engine every shipped build actually is, because the CSS is the runtime and
      # no text test can tell whether a container unit resolved.
      #
      # Chromium for the scanner test (apps/web/test/scanner-gpu.test.mjs): WebKit has no WebGPU to
      # test at all. That suite was written and merged without ever running here, and its first CI
      # run failed on a missing executable — a test that cannot start is not a test that passed.
      #
      # Playwright is an exact-pinned dev dep of apps/web; this fetches the matching builds. Missing
      # either fails the tests, loudly.
      - name: cubus-web — browser engines for the geometry and scanner suites
        run: pnpm --filter cubus-web exec playwright install --with-deps webkit chromium

      # UNDER XVFB, because the scanner suite launches Chromium HEADED and a runner has no display.
      # Headed is not a preference there: headless Chromium substitutes a software GPU that is
      # ~500x slower than a real one (measured, 7320 ms a frame against 15), so a headless run would
      # not test the GPU path, it would libel it.
      #
      # This does NOT give the runner a GPU. `requestAdapter()` still returns null here, and the
      # suite reports that and asserts the wasm floor instead — which is the half CI can honestly
      # gate. `--enable-unsafe-swiftshader` is deliberately not passed anywhere, so a software
      # adapter can never masquerade as hardware and turn this into a green that means nothing.
      - name: cubus-web — test
        run: xvfb-run -a pnpm --filter cubus-web test

      # The icons had no gate at all, which is why the iOS and Android projects carried Tauri's
      # placeholder mark from the day the mobile shells landed until someone looked at a phone.
      # Every check that needs an Apple-only tool (sips, assetutil, ictool) reports as skipped
      # here rather than failing the job; what still GATES on Linux is the whole mobile set —
      # every rung the iOS catalogue declares, at its declared size, with no alpha channel, and
      # the Android layers plus the anydpi wiring that makes them reachable at all.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: icons — the shipped rasters are the ones the sources produce
        run: |
          # librsvg, not just Pillow: the .ico round-trip decodes every member back and
          # compares it against a fresh render of the same source, which needs a renderer.
          # Without it the verifier raised before reporting a single gated check — and the
          # skip path is only a floor, not a substitute for actually running the check.
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          # The Pillow the golden harness pins (ml/requirements-golden.txt). Unpinned, the icon
          # measurements could move on a Pillow release while the golden job stayed put, and
          # nothing would say which of the two had actually changed.
          pip install --quiet pillow==12.3.0
          python scripts/verify-icons.py

  # THE PLATFORM BRANCHES THE LINUX JOB CANNOT SEE.
  #
  # `cargo check` on ubuntu compiles cube-vision's INERT branch — the one that registers no
  # commands. So `windows.rs` and the Android `android_ble.rs` could break, drift, or (as happened)
  # be dead on arrival, and every gate stayed green: a cfg'd-out module is not compiled, and code
  # that is not compiled cannot fail. Windows' native path was in fact unreachable in every build
  # for as long as it existed, because nothing bundled its model, and nothing here would have said
  # so.
  #
  # Compile-only, deliberately. These runners have no camera, no cube and no GPU, so they cannot
  # tell whether the paths WORK — only that they still build and that their command surfaces still
  # typecheck against the seam. That is the honest limit of what CI can assert here, and it is
  # strictly more than zero.
  rust-platforms:
    name: Rust (windows · android compile)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: ubuntu-latest
            target: aarch64-linux-android
            label: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.label }}

      # Android needs the NDK's linker on PATH for `cargo check` to resolve its target.
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        if: matrix.label == 'android'
        id: ndk
        with:
          ndk-version: r27c

      - name: check
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo check -p cube-vision -p cubus-desktop --target ${{ matrix.target }}

      - name: clippy
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo clippy -p cube-vision --target ${{ matrix.target }} -- -D warnings

      # Windows can also RUN its unit tests; the Android target cannot execute on the runner.
      - name: test
        if: matrix.label == 'windows'
        run: cargo test -p cube-vision -p cubus-desktop --lib --target ${{ matrix.target }}

  # THE APPLE BRANCHES, which the Linux job compiles as inert stubs and the job above never sees:
  # cube-vision's Swift half (built by swift-rs), apple.rs, the objc2 traffic-light code in lib.rs.
  # Until 2026-09-05 the first thing that compiled any of it was a tagged release build, so a
  # clippy warning in apple.rs was a red RELEASE rather than a red push. Same standard as Linux —
  # -D warnings across every target, and the unit tests that can run on a runner with no camera.
  rust-macos:
    name: Rust (macOS · iOS compile)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos

      - name: clippy
        run: cargo clippy -p cube-vision -p cubus-desktop --all-targets -- -D warnings

      - name: test
        run: cargo test -p cube-vision -p cubus-desktop --lib

      # And the phone. aarch64-apple-ios was compiled NOWHERE — release.yml's iOS Build step was
      # skipped for want of a certificate — so the iOS build script's first run would have been a
      # tag. A check is what a runner without a device can honestly do, and it is what fails when
      # a crate in the tree drops the target.
      - name: check (aarch64-apple-ios)
        run: cargo check -p cube-vision -p cubus-desktop --target aarch64-apple-ios

  rust:
    name: Rust (fmt · clippy · check · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tauri's Linux backend (webkit2gtk / appindicator / rsvg), plus dbus for btleplug — the
      # BLE bridge is back (2026-08-27, recovered from v0 for the smart-cube return).
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config \
            libpipewire-0.3-dev libclang-dev

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      # On Linux, cube-vision compiles to its inert stub (no Swift), which is exactly what a Windows/
      # Linux build ships — the app runs WebDetector there. The macOS golden job below is what
      # exercises the real native plugin.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: check
        run: cargo check --workspace

      # The dev-only MCP harness is a cargo FEATURE (`pnpm dev` builds with it, `tauri build` never
      # does), so the workspace check above compiles the desktop shell WITHOUT it, and the
      # feature-gated code in lib.rs could rot behind every gate while every dev machine still
      # built it. Compiled here; still never shipped.
      - name: desktop — the `mcp` feature still compiles
        run: cargo check -p cubus-desktop --features mcp

      # The desktop window's arithmetic (src/stage.rs) is held to the contract document's table,
      # the same rows the web oracle is held to.
      - name: desktop — stage arithmetic
        run: cargo test -p cubus-desktop --lib

      # The BLE bridge's own tests — the no-brand-constants rule in crates/cube-ble/tests and the
      # bridge's unit tests. clippy above COMPILES that test binary (--all-targets); nothing RAN
      # it until 2026-09-05, so a failing assertion in there was invisible to every gate.
      - name: cube-ble — tests
        run: cargo test -p cube-ble

      # The optimal solver's §7 verification bar (histograms, Bellman over all 173M entries,
      # superflip triple, metric contract, ball shells, geodesic fixtures to L=9, cancellation,
      # artifact corruption). Release profile because table generation is BFS over 88M entries —
      # debug would turn ~90 s into many minutes.
      - name: optimal solver plan checks (release)
        run: cargo test -p optimal-solver --release

  # THE ANDROID SHELL'S KOTLIN, on every push. Its unit tests cover the pure halves of the two
  # plugins (`letterboxFrom`, `uuid`, `hex`, `matches`) — the part that had no verification at all
  # before 2026-08-31, and where the defects were: a twelve-digit UUID group, an empty filter
  # matching every advertiser, a letterbox computed in Float where the TypeScript uses double.
  # Until 2026-09-05 they ran only in release.yml, i.e. only on a tag.
  android-shell:
    name: Android shell (Kotlin unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 21, not the runner default. Gradle 8.14.3 + AGP 8.11.0 run on 17-21, and a newer JDK dies
      # with "Unsupported class file major version NN", which names neither Java nor the fix.
      # scripts/tauri-android.mjs enforces the same range locally; this is the CI half of it.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-shell

      # THE TWO GRADLE FILES THE RUST BUILD OWNS. `gen/android/settings.gradle` applies
      # `tauri.settings.gradle` unconditionally and `app/build.gradle.kts` applies
      # `tauri.build.gradle.kts`; both are gitignored and written by tauri-build — the desktop
      # crate's build script — when TAURI_ANDROID_PROJECT_PATH names the project (they carry
      # absolute paths into the cargo registry, which is why they cannot be committed). `tauri
      # android init` does NOT write them: its template has neither (tauri-cli 2.11.4), and
      # `tauri android build` only gets them because its cargo build runs the script. The cheapest
      # thing that does the same is a `cargo check` for the Android target — it runs the build
      # script and links nothing, and the NDK is needed for that check alone. The files are then
      # ASSERTED, because a Gradle run that cannot configure fails in a way that names none of this.
      - name: generate tauri.settings.gradle and tauri.build.gradle.kts
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android
          # What `tauri android build` exports before its cargo build, and what tauri's and wry's
          # build scripts demand once TAURI_ANDROID_PROJECT_PATH turns the Android codegen on:
          # the package the Kotlin files belong to, the Rust library they load, and the directory
          # the generated Kotlin is written to (which must already exist — wry canonicalises it).
          # The first run of this job on a real runner panicked on exactly the first of these
          # (2026-09-05), which a `cargo check` without the project path never asks for.
          WRY_ANDROID_PACKAGE: im.cubus.app
          WRY_ANDROID_LIBRARY: cubus_desktop_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android/app/src/main/java/im/cubus/app/generated
        run: |
          set -eu
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          cargo check -p cubus-desktop --target aarch64-linux-android
          for f in tauri.settings.gradle app/tauri.build.gradle.kts; do
            test -f "apps/desktop/src-tauri/gen/android/$f" \
              || { echo "::error::the Rust build did not write gen/android/$f — Gradle cannot configure the project without it"; exit 1; }
          done

      # No device and no Rust library: buildSrc's RustPlugin hooks the cargo build onto the
      # merge*JniLibFolders tasks, which the unit-test task graph never reaches. What the graph
      # does reach is :app:copyCubeModel, so ml/models/cube-yolo.tflite has to exist here — it is
      # tracked, and that task fails rather than skips if it ever is not.
      - name: Kotlin unit tests
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew testArm64DebugUnitTest

  # The golden-frame parity gate (dev-docs/native-capture-and-inference-plan.md, Phase 4). Every
  # runtime must read the 20 committed fixtures exactly as ml/golden/expected.json pins it, or a
  # model/runtime has drifted from the one checkpoint. Split by platform: the runtimes that run on
  # Linux here, CoreML + the native plugin path on macOS below.
  golden-linux:
    name: Golden frames (onnx · int8 · tflite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the golden-harness runtimes
        run: pip install -r ml/requirements-golden.txt
      # The pipeline's pure pieces — the cube geometry, the one-pigment-per-colour rule, the
      # COCO→YOLO conversion. Off-GPU by design and, until 2026-09-05, off-CI by accident: a test
      # file with a docstring saying how to run it, run by nobody.
      - name: The pipeline's pure pieces
        run: python ml/test_pipeline.py
      # Needs no model, no runtime and no hardware — it exercises the faithfulness rule itself,
      # which was inverted when first written and passed every real leg anyway.
      - name: The faithfulness rule is directional
        run: python ml/golden_frames.py --self-check
      - name: onnx · onnx-int8 · tflite — host-internal parity (see golden_frames.py, PARITY mode)
        run: python ml/golden_frames.py --parity --legs onnx onnx-int8 tflite

  golden-macos:
    name: Golden frames (coreml · native plugin)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the golden-harness runtimes
        run: pip install -r ml/requirements-golden.txt
      # The native leg drives the plugin's OWN letterbox + CoreML through cube-vision-probe, so build
      # it — this is what proves the shipped native code, not a Python stand-in, still reads identically.
      - name: Build the cube-vision probe
        run: swift build -c release --package-path crates/cube-vision/swift
      # The fp16 widening in Model.swift is hand-written, because Swift's Float16 is arm64-only and
      # the macOS release target is a universal binary. Exhaustive over all 65,536 half patterns, so
      # it is a proof and not a sample — it caught 1022 wrong ones (signalling NaNs) on its first run.
      - name: The fp16 widening matches Float16, exhaustively
        run: crates/cube-vision/swift/.build/release/cube-vision-probe --self-check
      - name: coreml · native — exact class parity with THIS host's fp32, plus the pinned model bytes
        run: python ml/golden_frames.py --parity --legs onnx coreml native
      # The same check with CoreML pinned to the CPU, which discriminates between the two candidate
      # causes of the fp16 divergence this runner shows and no local Mac does. `--compute-units all`
      # lets CoreML choose ANE, GPU or CPU by what the machine has; `cpu_only` removes that choice.
      # It survived: measured 2026-09-01, cpu_only refuses photo-01 exactly as `all` does, on both
      # legs. So the cause is the silicon's fp16 arithmetic and not dispatch, and no compute-unit
      # setting removes it. The step stays as a REGRESSION guard rather than a question: if a future
      # runner ever diverges under one setting and not the other, that is new information.
      #
      # A gate, not a probe: the faithful legs must never MISREAD under either dispatch. A refusal
      # is tolerated by the rule in golden_frames.py either way, so this cannot go red merely for
      # reproducing what we already know.
      - name: coreml · native — parity holds with dispatch removed (cpu_only)
        run: python ml/golden_frames.py --parity --legs onnx coreml native --compute-units cpu_only

  # WHAT THE TREE PULLS IN, and what the scripts say. Neither ran anywhere until 2026-09-05.
  supply-chain:
    name: Supply chain (cargo audit · shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-04
        with:
          toolchain: stable

      # Caches ~/.cargo/bin too, so the install below is paid once per lockfile change.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: supply-chain

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      # A GATE FOR NEW ADVISORIES, not a report nobody reads. `cargo audit` alone exits 0 on
      # warnings, and this tree carries nineteen of them from upstreams this project cannot fix —
      # so the known ones are listed by ID, each with its reason, and anything NOT on the list
      # fails the job: a fresh vulnerability, a crate newly marked unmaintained or unsound.
      # Reviewed 2026-09-05; delete an entry when its upstream fix lands, so the gate notices a
      # regression rather than silently forgiving it.
      #
      #   RUSTSEC-2024-0411 … 0420  gtk-rs GTK3 bindings, unmaintained. Tauri's Linux backend is
      #                             webkit2gtk on GTK3; leaving it is Tauri's migration, not ours.
      #   RUSTSEC-2024-0429         glib 0.18 `VariantStrIter` unsoundness — same tree, same owner.
      #   RUSTSEC-2024-0436, -0370  paste, proc-macro-error: proc-macro helpers reached only
      #                             through tauri's and its plugins' trees; nothing here calls them.
      #   RUSTSEC-2025-0075/0080/0081/0098/0100  unic-*: via tauri-utils' identifier validation.
      #
      # `yanked` is NOT denied: the one yanked crate in the tree (chacha20 0.10.1, via
      # tauri-plugin-mcp → xcap → rand) has no advisory ID to allow-list, and it sits behind the
      # dev-only `mcp` feature that no release binary compiles. It still prints.
      - name: cargo audit
        run: |
          cargo audit --deny unmaintained --deny unsound \
            --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100

      # Every shell script in scripts/. The gate that would have caught `security list-keychain
      # -s` replacing a keychain search list and an unquoted `build-tools/*/apksigner` glob, had
      # it existed when those were written.
      - name: shellcheck
        run: shellcheck scripts/*.sh

      # The licence notices are generated from the lockfiles and the packages themselves
      # (scripts/make-third-party-notices.mjs) and committed, like the vendored bundles — and like
      # them they drift the moment a dependency moves and nobody re-runs the generator. This is
      # the only job with both cargo and node, so it is where the committed file is compared to
      # what the tree would generate now; `pnpm notices` is the fix.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: THIRD_PARTY_NOTICES.md matches the lockfiles
        run: pnpm notices --check

  # Committed credentials. The 2026-09-04 read-through found none; this is what keeps that true
  # without a read-through. `.gitleaksignore` at the root carries the known false positives —
  # the GAN protocol's published AES key in gan-driver's protocol notes, a constant of the wire
  # format that every implementation contains, not a secret of ours.
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The action scans the commits of the push (or the PR), and needs their parents to do it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments would need `pull-requests: write`; the job fails visibly without them.
          GITLEAKS_ENABLE_COMMENTS: "false"
