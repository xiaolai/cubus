name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  driver:
    name: gan-driver (typecheck · lint · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gan-driver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gan-driver/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage

  scanner:
    name: cube-scanner (typecheck · lint · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cube-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cube-scanner/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage
