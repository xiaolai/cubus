name: Update Homebrew Tap

# ON PUBLICATION, because that is the moment the thing this job needs starts existing.
#
# It used to be dispatched from release.yml's draft job, and that could not work: the cask points at
# `releases/download/vX.Y.Z/...`, a DRAFT does not serve that URL to anyone unauthenticated, and
# this job polls it with plain curl. So every release failed here on a 404 — measured, twice — and
# the tap was only ever updated by someone re-running the job by hand after publishing. The
# dispatch also fired BEFORE the release was created at all, one step ahead of the job that makes
# it, which no amount of polling fixes.
#
# `published` fires when a draft is published, which is exactly when the assets become public. The
# old note warned against `on: release` because the event beats the uploads — true for a release
# created WITH its files, and not true here: a draft's assets were uploaded minutes earlier, and
# publishing only flips its visibility. The poll below remains as the belt.
#
# workflow_dispatch stays, for re-running a release whose tap update failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.3 — no leading v)'
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: xiaolai/cubus
    steps:
      # WHICH VERSION, resolved in a shell rather than an expression: the two triggers name it
      # differently (a published release gives `v0.2.3`, a hand dispatch gives `0.2.3`), and
      # Actions expressions have no way to strip a prefix without becoming unreadable. One `#v`
      # here is clearer than a nested ternary nobody can check.
      - name: Which version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          VERSION="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=cubus_${VERSION}_universal.dmg" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"

      # Guards 1 and 3 come before any network work, so a bad dispatch dies in seconds.
      - name: Stable versions only
        run: |
          set -eu
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a bare X.Y.Z. A prerelease in the tap reaches every"
            echo "::error::stable `brew upgrade` user. release.yml gates this too; a manual"
            echo "::error::dispatch bypasses that gate, which is why the check is repeated here."
            exit 1
          fi

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: xiaolai/homebrew-tap
          # A deploy key, not a PAT: it can write to this one repository and nothing else, and it
          # does not expire. An expired token would fail SILENTLY here, because the dispatch in
          # release.yml is continue-on-error — releases would stay green while the tap quietly
          # stopped tracking them.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Refuse to downgrade
        run: |
          set -eu
          current=$(grep -oE '^  version "[^"]+"' tap/Casks/cubus.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.0")
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
          # Nothing orders these runs. A re-run, a late-finishing job and a manual backfill all
          # write last-writer-wins; on another project three landed inside 40 seconds and left the
          # tap advertising an older version than was already out. Equal is allowed so a re-run is
          # idempotent; older is refused.
          if [ "$newest" != "$VERSION" ]; then
            echo "::error::tap has $current; refusing to write the older $VERSION"
            exit 1
          fi
          echo "tap has $current, publishing $VERSION"

      - name: Wait for the release asset
        run: |
          set -eu
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/${ASSET}"
          for attempt in $(seq 1 30); do
            code=$(curl -sI -o /dev/null -w "%{http_code}" -L "$URL")
            case "$code" in
              200|302) echo "$ASSET available"; exit 0 ;;
            esac
            echo "attempt ${attempt}/30 — $ASSET: HTTP $code, waiting 30s…"
            sleep 30
          done
          echo "::error::$ASSET never appeared. Check the filename: tauri names the universal"
          echo "::error::bundle <product>_<version>_universal.dmg, and a wrong name here fails as"
          echo "::error::this 15-minute timeout with nothing else to point at it."
          exit 1

      - name: Download and hash
        id: sha
        run: |
          set -eu
          curl -sL -o asset.dmg "https://github.com/${REPO}/releases/download/v${VERSION}/${ASSET}"
          echo "sha256=$(sha256sum asset.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate the cask
        env:
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -eu
          # Unquoted delimiter, so ${VERSION} and ${SHA256} expand while Ruby's own #{version}
          # survives — the shell does not interpolate `#{`. Every backtick inside must be escaped
          # as \` or the shell runs it as a command substitution and splices stdout into the cask.
          cat > tap/Casks/cubus.rb <<RUBY
          cask "cubus" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/xiaolai/cubus/releases/download/v#{version}/cubus_#{version}_universal.dmg"
            name "cubus"
            desc "Rubik's Cube tutor that reads your cube with the camera and guides the solve"
            homepage "https://github.com/xiaolai/cubus"

            # One universal binary covers both architectures, so there is no arch split here.
            #
            # NO auto_updates, deliberately, and it means BOTH paths work rather than neither.
            #
            # The app does update itself on macOS (tauri-plugin-updater; see SELF_UPDATE_PLATFORMS
            # in apps/web/lib/app-update.js). Declaring auto_updates would tell Homebrew to stand
            # down and leave the app as the only way, and plenty of people manage their Mac with
            # \`brew upgrade\` and expect it to keep working. Left off, both do.
            #
            # The two do not fight, because they move together: each follows the same GitHub
            # releases, and this workflow runs on \`release: published\` — within seconds of the
            # manifest the app reads. So \`brew upgrade\` reinstalls the version the app already
            # has, which is a redundant copy rather than a downgrade. The downgrade worth fearing
            # needs the cask to LAG the app, and that is a property of a tap that updates late.
            depends_on macos: :ventura

            app "cubus.app"

            zap trash: [
              "~/Library/Application Support/im.cubus.app",
              "~/Library/Caches/im.cubus.app",
              "~/Library/HTTPStorages/im.cubus.app",
              "~/Library/Preferences/im.cubus.app.plist",
              "~/Library/Saved Application State/im.cubus.app.savedState",
              "~/Library/WebKit/im.cubus.app",
            ]
          end
          RUBY
          echo "--- generated ---"; cat tap/Casks/cubus.rb

      - name: Commit and push
        run: |
          set -eu
          cd tap
          if git diff --quiet -- Casks/cubus.rb; then
            echo "cask already describes $VERSION — nothing to push"
            exit 0
          fi
          git config user.name "xiaolai"
          git config user.email "lixiaolai@gmail.com"
          git add Casks/cubus.rb
          git commit -m "cubus ${VERSION}"
          git push
