name: Deploy site

# The introduction site at https://cubus.im — apps/site/public, published verbatim to GitHub
# Pages. It is NOT the app: README.md ("Hosting the web build") records why the web app is not
# served from here yet. The site's own test (apps/site/site.test.mjs) is the gate — every picture
# the page names exists at the size the capture script produces, the page loads nothing remote,
# the copied tokens and icons are identical to the app's, and this file says what that test
# expects it to say. A pull request runs the check and stops; a push to main deploys.
#
# Every third-party action is pinned to a full commit SHA (the version is the trailing comment),
# as in ci.yml: a tag is a name somebody else can re-point.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Read-only by default; only the deploy job is granted what a Pages deployment needs.
permissions:
  contents: read

# One deployment at a time, and never cancelled: Pages serves whatever finished last, and a
# deployment stopped halfway is not a state anyone wants to reason about.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Plain Node, no install: the test reads files and image headers and imports nothing
      # from node_modules, so the gate cannot be skipped by a missing dependency.
      - name: site — check
        run: node --test apps/site/site.test.mjs

      - name: upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The Pages site itself was created ONCE, by the owner, on 2026-09-06:
      #   gh api -X POST repos/xiaolai/cubus/pages -f build_type=workflow
      # The workflow cannot do that for itself: `enablement: true` asks the job's own token to
      # create the site, and the first run answered "Resource not accessible by integration" —
      # creating a site is an administrative act GITHUB_TOKEN is never granted, whatever
      # `permissions:` says. So this step only reads the site that exists, and fails loudly if it
      # is ever deleted. The custom domain is a setting of that site, made the same day by hand
      # (`gh api -X PUT repos/xiaolai/cubus/pages -f cname=cubus.im`): a workflow deployment
      # IGNORES a CNAME file in the artifact — public/CNAME is the in-repo record of the domain,
      # not what sets it, and the first deploy landed with no domain to prove it.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
