# gitleaks configuration.
#
# WHY THIS FILE EXISTS, AND WHY THE ALLOWLIST MOVED HERE (2026-09-20). The one known false positive
# — the GAN smart cube's published AES key — was allowlisted in `.gitleaksignore` by FINGERPRINT, and
# a gitleaks fingerprint is `commit:file:rule:line`. The history rewrite of 2026-09-20 gave every
# commit a new SHA, so both fingerprints stopped matching and a documented non-secret came back as a
# fresh finding: the nightly went red over a file nobody had touched.
#
# A fingerprint cannot survive a history rewrite, and this repository has now done one. So the
# exemption is keyed on what does not move — the path, the rule, and the value itself — and the next
# rewrite cannot re-break it. `.gitleaksignore` keeps its entries as a record of the old keying; they
# match nothing now and are harmless.
#
# THIS IS NOT A BASELINE. Nothing is being accepted that was not already justified in prose: the key
# below is a constant of the GAN wire format, published by afedotov/gan-web-bluetooth (MIT) and
# carried by every implementation of that protocol. It is the cube's, not this project's, and a
# reader needs it to follow the protocol notes at all. Any OTHER finding still fails the job.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = "The GAN cube's published protocol key/iv — the wire format's constant, not a credential."
  paths = ['''packages/gan-driver/docs/protocol\.md''', '''gan16-driver/docs/protocol\.md''']
