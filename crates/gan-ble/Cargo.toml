[package]
name = "gan-ble"
version = "0.1.0"
edition = "2021"

# Native GAN-cube BLE bridge (btleplug) — the stack the Tauri backend uses.
# Currently a proof binary (src/main.rs, verified on hardware); Phase 3 exposes it as a
# lib for apps/desktop/src-tauri (scan -> MAC -> subscribe FFF6 -> write FFF5).

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
uuid = "1"
