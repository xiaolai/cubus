# The optimal solver — Korf's IDA* over pattern databases, written from the published method.
# Provenance (what was and was not read before writing this): dev-docs/optimal-solver-provenance.md.
# The verification bar it must clear before the app may say "optimal": optimal-solver-plan.md §7.
[package]
name = "optimal-solver"
version = "0.1.0"
description = "Prove a 3x3 solution minimal: three pattern databases and IDA*, per Korf 1997"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# Root-parallel IDA* and parallel Bellman validation over 88M-entry tables. The plan's own
# search-choice row names root parallelism; validating 1.6G transitions single-threaded would
# turn every test run into minutes.
rayon = "1"
# Artifact integrity: every table file carries a SHA-256 and the loader refuses any corrupt or
# truncated file (plan §7, packed-layout row). Corruption here is silent inadmissibility.
sha2 = "0.10"
# Uniform random states for the library generator and the distribution smoke test — the same
# "random state, never random turns, never a weak source" discipline as apps/web/lib/random-state.js.
getrandom = "0.2"
